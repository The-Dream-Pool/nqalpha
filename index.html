<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NQ Alpha — Under Construction</title>
<meta name="description" content="NQ Alpha is currently under construction. Back shortly.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04080D">
<link rel="icon" href="favicon.png">
<meta property="og:title" content="NQ Alpha">
<meta property="og:description" content="Under construction. Back shortly.">
<meta property="og:image" content="https://nqalpha.com/og_image.png">
<meta property="og:url" content="https://nqalpha.com">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#04080D;--bd:#162030;--green:#00E8A2;--gold:#E2B86A;--white:#fff;--text:#BECCDA;--muted:#6C7C8E;--mono:'DM Mono',monospace;--font:'Outfit',sans-serif;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);display:flex;align-items:center;justify-content:center;padding:28px;overflow:hidden;-webkit-font-smoothing:antialiased}
.bgwrap{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.grid{position:absolute;inset:-2px;background-image:linear-gradient(rgba(22,32,48,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(22,32,48,.5) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 30%,transparent 75%)}
.halo{position:absolute;left:50%;top:38%;width:760px;height:760px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(0,232,162,.09),transparent 62%)}
.card{position:relative;text-align:center;max-width:560px;width:100%}
.mark{display:inline-flex;align-items:center;gap:13px;margin-bottom:34px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 18px rgba(0,232,162,.75);animation:pulse 1.9s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.28);opacity:.55}}
.wm{font-size:clamp(22px,5.4vw,27px);font-weight:800;letter-spacing:5px;color:var(--white)}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:5px;color:var(--gold);margin-bottom:16px}
h1{font-size:clamp(30px,7.4vw,46px);font-weight:900;letter-spacing:-1.2px;line-height:1.08;color:var(--white);margin-bottom:18px}
h1 em{font-style:normal;background:linear-gradient(120deg,var(--green),#00C4FF);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
p{font-size:clamp(14px,3.4vw,15.5px);line-height:1.75;color:var(--muted);max-width:430px;margin:0 auto 34px}
.bar{width:min(280px,80%);height:2px;margin:0 auto 30px;background:rgba(22,32,48,.9);border-radius:2px;overflow:hidden;position:relative}
.bar::after{content:'';position:absolute;top:0;left:-42%;width:42%;height:100%;background:linear-gradient(90deg,transparent,var(--green),transparent);animation:slide 2.1s ease-in-out infinite}
@keyframes slide{0%{left:-42%}100%{left:100%}}
.meta{font-family:var(--mono);font-size:10px;letter-spacing:2.4px;color:var(--muted)}
.meta a{color:var(--green);text-decoration:none;border-bottom:1px solid rgba(0,232,162,.28);padding-bottom:1px}
.meta a:hover{border-color:var(--green)}
.foot{position:fixed;left:0;right:0;bottom:20px;text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:2px;color:#3C4756}
@media (prefers-reduced-motion:reduce){.dot,.bar::after{animation:none}}
</style>
</head>
<body>
<div class="bgwrap"><div class="grid"></div><div class="halo"></div></div>

<div class="card">
  <div class="mark"><span class="dot"></span><span class="wm">NQ ALPHA</span></div>
  <div class="kicker">UNDER CONSTRUCTION</div>
  <h1>We're building<br><em>something better.</em></h1>
  <p>The site is temporarily offline while we make updates. Everything will be back shortly.</p>
  <div class="bar"></div>
  <div class="meta">QUESTIONS? <a href="mailto:support@nqalpha.com">SUPPORT@NQALPHA.COM</a></div>
</div>

<div class="foot">NQ ALPHA LLC &middot; DALLAS, TX</div>
</body>
</html>
