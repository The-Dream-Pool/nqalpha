<style>
:root{--bg:#04080D;--sf:#0A1018;--sf2:#0E1620;--bd:#162030;--green:#00E8A2;--cyan:#00C4FF;--gold:#F0C040;--red:#FF4466;--text:#B8C8D8;--muted:#405060;--white:#F0F4F8;--font:'Outfit',sans-serif;--mono:'DM Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{max-width:100vw;overflow-x:hidden;touch-action:pan-y;-ms-touch-action:pan-y;overscroll-behavior-x:none;}
body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-text-size-adjust:100%;}
::selection{background:rgba(0,232,162,.2);color:var(--white);}
input::placeholder{color:var(--muted);}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes mnqGlow{0%,100%{box-shadow:0 0 20px rgba(0,196,255,.08),0 0 40px rgba(0,196,255,.03),inset 0 0 30px rgba(0,196,255,.02)}50%{box-shadow:0 0 35px rgba(0,196,255,.15),0 0 60px rgba(0,196,255,.06),inset 0 0 40px rgba(0,196,255,.04)}}
@keyframes mesGlow{0%,100%{box-shadow:0 0 20px rgba(0,232,162,.06),0 0 40px rgba(0,232,162,.02)}50%{box-shadow:0 0 30px rgba(0,232,162,.1),0 0 50px rgba(0,232,162,.04)}}
@keyframes borderPulse{0%,100%{border-color:rgba(0,196,255,.2)}50%{border-color:rgba(0,196,255,.4)}}
@keyframes orbFloat{0%,100%{transform:translate(0,0)}25%{transform:translate(10px,-15px)}50%{transform:translate(-5px,-25px)}75%{transform:translate(-15px,-10px)}}
@keyframes heroGlow{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shimmer{0%{left:-100%}100%{left:200%}}
@keyframes rwdShimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.page{display:none;}.page.active{display:block;}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 40px;border-bottom:none;position:sticky;top:0;background:rgba(4,8,13,.92);backdrop-filter:blur(16px);z-index:100;}nav::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,232,162,.2),rgba(0,196,255,.15),transparent);}
.nav-admin::after{background:linear-gradient(90deg,transparent,rgba(240,192,64,.3),rgba(240,192,64,.15),transparent)!important;}
.admin-wrap .dash-card:hover{border-color:rgba(240,192,64,.2)!important;box-shadow:0 8px 24px rgba(0,0,0,.2),0 0 15px rgba(240,192,64,.04)!important;}
.admin-wrap .dash-card::before{background:radial-gradient(circle,rgba(240,192,64,.04),transparent 70%)!important;}
.admin-wrap .dash-tab:hover{color:var(--gold)!important;background:rgba(240,192,64,.03)!important;}
.admin-wrap .card:hover{border-color:rgba(240,192,64,.15)!important;}
.admin-wrap .how-box:hover{border-color:rgba(240,192,64,.15)!important;}
.admin-wrap table tr:hover td{background:rgba(240,192,64,.015)!important;}
.admin-wrap .btn:hover{border-color:var(--gold)!important;color:var(--gold)!important;}
/* ── Master Account tab ───────────────────────────────────────────── */
.ma-header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:12px;}
.ma-title{font-size:24px;font-weight:700;color:var(--white);line-height:1.2;}
.ma-subtitle{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;}
.ma-refresh-btn{font-family:var(--mono);font-size:10px;padding:8px 16px;background:transparent;border:1px solid var(--bd);border-radius:8px;color:var(--muted);cursor:pointer;transition:all .2s;flex-shrink:0;}
.ma-refresh-btn:hover{border-color:var(--gold);color:var(--gold);}

.ma-card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:24px;margin-bottom:16px;}
.ma-card-danger{border-color:rgba(255,68,102,.2);}
.ma-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;flex-wrap:wrap;gap:10px;}
.ma-card-meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px;}
.ma-card-desc{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.6;}
.ma-badge{font-family:var(--mono);font-size:9px;color:var(--gold);background:rgba(240,192,64,.06);border:1px solid rgba(240,192,64,.2);padding:5px 10px;border-radius:5px;letter-spacing:1px;flex-shrink:0;}

.ma-mc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
.ma-mc-tile{background:rgba(10,16,24,.6);border:1px solid var(--bd);border-radius:10px;padding:14px;position:relative;overflow:hidden;}
.ma-mc-bar{position:absolute;top:0;left:0;right:0;height:2px;}
.ma-mc-label{font-family:var(--mono);font-size:9px;letter-spacing:1px;margin-bottom:4px;}
.ma-mc-desc{font-family:var(--mono);font-size:9px;color:var(--muted);margin-bottom:10px;}
.ma-mc-input{width:100%;background:#04080D;border:1px solid var(--bd);color:var(--white);padding:10px 12px;border-radius:6px;font-size:18px;font-weight:700;font-family:var(--mono);text-align:center;-webkit-appearance:none;-moz-appearance:textfield;box-sizing:border-box;}
.ma-mc-input::-webkit-outer-spin-button,.ma-mc-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.ma-mc-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,192,64,.08);}
.ma-mc-range{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:6px;text-align:center;}

.ma-save-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.ma-save-status{font-family:var(--mono);font-size:11px;color:var(--muted);}

.ma-btn{font-family:var(--mono);font-size:11px;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:700;letter-spacing:1px;transition:all .2s;border:1px solid;background:transparent;}
.ma-btn-row{display:flex;flex-wrap:wrap;gap:10px;}
.ma-btn-save{background:rgba(0,232,162,.08);border-color:rgba(0,232,162,.3);color:var(--green);padding:10px 20px;font-size:10px;}
.ma-btn-save:hover{background:rgba(0,232,162,.15);border-color:var(--green);}
.ma-btn-resume{background:rgba(0,232,162,.08);border-color:rgba(0,232,162,.3);color:var(--green);}
.ma-btn-resume:hover{border-color:var(--green);background:rgba(0,232,162,.15);}
.ma-btn-danger{background:rgba(255,68,102,.06);border-color:rgba(255,68,102,.3);color:var(--red);}
.ma-btn-danger:hover{border-color:var(--red);background:rgba(255,68,102,.12);}
.ma-btn-warn{background:rgba(240,192,64,.06);border-color:rgba(240,192,64,.3);color:var(--gold);}
.ma-btn-warn:hover{border-color:var(--gold);background:rgba(240,192,64,.12);}

.ma-danger-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.ma-danger-dot{width:8px;height:8px;border-radius:50%;background:var(--red);}

.ma-status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.ma-status-tile{background:rgba(10,16,24,.6);border:1px solid var(--bd);border-radius:10px;padding:14px;}
.ma-status-label{font-family:var(--mono);font-size:9px;color:var(--muted);margin-bottom:6px;letter-spacing:1px;}
.ma-status-val{font-size:20px;font-weight:700;font-family:var(--mono);}

@media(max-width:768px){
  .ma-header{margin-bottom:16px;gap:10px;}
  .ma-title{font-size:20px;}
  .ma-subtitle{font-size:11px;}
  .ma-refresh-btn{font-size:9px;padding:7px 13px;}
  .ma-card{padding:18px 16px;border-radius:12px;margin-bottom:12px;}
  .ma-card-head{margin-bottom:6px;}
  .ma-card-desc{font-size:11px;margin-bottom:14px;}
  .ma-badge{font-size:8px;padding:4px 8px;}
  .ma-mc-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .ma-mc-tile{padding:12px 10px;}
  .ma-mc-input{font-size:20px;padding:12px 8px;}
  .ma-mc-label{font-size:10px;}
  .ma-mc-desc{font-size:9px;margin-bottom:8px;}
  .ma-save-row{flex-direction:column;align-items:stretch;gap:8px;}
  .ma-btn-save{width:100%;padding:14px;font-size:11px;}
  .ma-save-status{text-align:center;}
  .ma-btn-row{flex-direction:column;gap:8px;}
  .ma-btn{width:100%;padding:14px;font-size:11px;}
  .ma-status-grid{grid-template-columns:repeat(3,1fr);gap:8px;}
  .ma-status-tile{padding:12px 8px;}
  .ma-status-label{font-size:8px;}
  .ma-status-val{font-size:16px;}
}
@media(max-width:359px){
  .ma-mc-grid{grid-template-columns:1fr;}
  .ma-mc-tile{padding:14px;}
  .ma-mc-input{font-size:22px;}
}

.logo{display:flex;align-items:center;gap:12px;}.logo-dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 14px rgba(0,232,162,.4);animation:pulse 2s ease infinite;}.logo-text{font-size:18px;font-weight:800;color:var(--white);letter-spacing:-.5px;}.logo-sub{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:2px;margin-left:4px;}
.btn{font-family:var(--mono);font-size:11px;padding:10px 28px;background:transparent;border:1px solid var(--bd);border-radius:8px;color:var(--text);cursor:pointer;transition:all .2s;}.btn:hover{border-color:var(--green);color:var(--green);}
.btn-primary{background:linear-gradient(135deg,var(--green),#00c968);border:none;color:var(--bg);font-family:var(--font);font-weight:700;font-size:14px;padding:14px 36px;border-radius:10px;box-shadow:0 4px 20px rgba(0,232,162,.2);transition:all .2s;}.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(0,232,162,.35);}
.btn-ghost{font-family:var(--mono);font-size:12px;padding:14px 32px;background:transparent;border:1px solid var(--bd);border-radius:10px;color:var(--text);cursor:pointer;transition:all .2s;}.btn-ghost:hover{border-color:rgba(0,196,255,.4);color:var(--cyan);box-shadow:0 0 15px rgba(0,196,255,.1);}
.hero{text-align:center;padding:120px 40px 80px;position:relative;overflow:hidden;}.hero:before{content:'';position:absolute;top:-30%;left:50%;transform:translateX(-50%);width:1200px;height:600px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,232,162,.06) 0%,transparent 70%);pointer-events:none;animation:heroGlow 6s ease-in-out infinite;}.hero:after{content:'';position:absolute;top:10%;right:10%;width:400px;height:400px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,196,255,.04) 0%,transparent 70%);pointer-events:none;animation:heroGlow 8s ease-in-out infinite reverse;}
.hero-tag{font-family:var(--mono);font-size:12px;color:var(--green);letter-spacing:5px;margin-bottom:24px;animation:fadeUp .6s ease both;text-shadow:0 0 20px rgba(0,232,162,.3);}
.hero h1{font-size:68px;font-weight:900;color:var(--white);letter-spacing:-3px;line-height:1.02;margin-bottom:24px;animation:fadeUp .6s ease .1s both;}.hero h1 span{background:linear-gradient(135deg,var(--green),var(--cyan),var(--green));background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradientShift 6s ease infinite;}
.hero p{font-size:18px;color:rgba(184,200,216,.75);max-width:580px;margin:0 auto 52px;line-height:1.8;animation:fadeUp .6s ease .2s both;}
.hero-btns{display:flex;gap:16px;justify-content:center;animation:fadeUp .6s ease .3s both;}
.main{max-width:1100px;margin:0 auto;padding:0 40px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:48px;}.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}.grid3{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.stat{background:linear-gradient(160deg,var(--sf),rgba(14,22,32,.7));border:1px solid var(--bd);border-radius:14px;padding:20px 22px;animation:fadeUp .6s ease both;transition:border-color .3s,transform .3s,box-shadow .3s;display:flex;flex-direction:column;min-height:132px;}.stat:hover{border-color:rgba(0,232,162,.25);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.2),0 0 20px rgba(0,232,162,.04);}
.stat-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1.5px;margin-bottom:10px;text-transform:uppercase;min-height:28px;line-height:1.4;}.stat-value{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1.1;}.stat-sub{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:auto;padding-top:8px;line-height:1.5;}
.card{background:linear-gradient(160deg,var(--sf),rgba(14,22,32,.6));border:1px solid var(--bd);border-radius:18px;padding:28px;margin-bottom:48px;transition:border-color .3s;}.card:hover{border-color:rgba(0,232,162,.15);}.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}.card-title{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:2px;}.card-subtitle{font-size:16px;font-weight:600;color:var(--white);margin-top:6px;}.card-value{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--green);text-align:right;}.card-hint{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px;text-align:right;}
.yr-card{text-align:center;padding:20px;background:linear-gradient(160deg,var(--sf2),rgba(14,22,32,.5));border-radius:12px;border:1px solid var(--bd);transition:all .3s;cursor:default;}.yr-card:hover{border-color:rgba(0,232,162,.25);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.2),0 0 15px rgba(0,232,162,.04);}.yr-card .year{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:10px;}.yr-card .val{font-size:24px;font-weight:700;color:var(--green);}.yr-card .pct{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:6px;}
.strat-card{background:linear-gradient(160deg,var(--sf),rgba(14,22,32,.7));border-radius:16px;border:1px solid var(--bd);overflow:hidden;transition:all .3s;position:relative;display:flex;flex-direction:column;height:100%;}.strat-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.3);}.strat-bar{height:3px;flex-shrink:0;}.strat-body{padding:22px 18px 20px;display:flex;flex-direction:column;flex:1;}.strat-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-shrink:0;}.strat-icon{font-size:20px;}.strat-name{font-size:16px;font-weight:700;color:var(--white);}.strat-tag{font-family:var(--mono);font-size:9px;letter-spacing:1px;margin-bottom:14px;line-height:1.5;flex-shrink:0;min-height:28px;}.strat-desc{font-size:12px;color:rgba(184,200,216,.75);line-height:1.65;}.sd-toggle{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--white);cursor:pointer;user-select:none;padding:4px 0;margin-bottom:14px;transition:color .2s;background:none;border:none;flex-shrink:0;text-align:left;}.sd-arrow{display:inline-block;transition:transform .3s;font-size:8px;}.sd-body{max-height:0;overflow:hidden;opacity:0;transition:max-height .35s ease,opacity .3s ease,margin .3s ease;margin-bottom:0;flex-shrink:0;}.sd-body.open{max-height:340px;opacity:1;margin-bottom:18px;}.sd-body.open + .strat-stats{}.strat-spacer{flex:1;}.strat-stats{background:linear-gradient(160deg,var(--sf2),rgba(14,22,32,.5));border:1px solid rgba(22,32,48,.6);border-radius:10px;padding:14px 12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;flex-shrink:0;margin-top:auto;}.ss-label{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:.8px;}.ss-val{font-size:15px;font-weight:700;color:var(--white);margin-top:2px;}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}.char{text-align:center;padding:16px 8px;border-radius:12px;transition:all .3s;}.char:hover{background:rgba(0,232,162,.02);}.char-label{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:10px;}.char-val{font-size:24px;font-weight:700;}.char-sub{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:6px;}
.cta{text-align:center;padding:64px 0 96px;position:relative;}.cta::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:600px;height:300px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,232,162,.04),transparent 70%);pointer-events:none;}.cta-tag{font-family:var(--mono);font-size:10px;color:var(--green);letter-spacing:4px;margin-bottom:16px;text-shadow:0 0 15px rgba(0,232,162,.3);}.cta h2{font-size:36px;font-weight:800;color:var(--white);margin-bottom:14px;letter-spacing:-.5px;}.cta p{font-size:15px;color:var(--muted);max-width:460px;margin:0 auto 36px;line-height:1.7;}.cta .fee{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:16px;}
.footer{border-top:none;padding:28px 40px;text-align:center;position:relative;}.footer::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,232,162,.15),rgba(0,196,255,.1),transparent);}.footer p{font-family:var(--mono);font-size:9px;color:var(--muted);line-height:2;max-width:700px;margin:0 auto;}

  var fi=Math.floor(vis);
  if(fi<N&&vis-fi>0)rpDrawCandle(ctx,fi,vis-fi,padL,cw,bw,Y);
  // ── events: markers, connectors, floating P&L ──
  var lastEvent=null,openPos=[],realized=0;
  RP.events.forEach(function(e){
    var revealed=vis>=e.i+(typeof e.f==='number'?e.f:0.6);
    if(!revealed)return;
    lastEvent=e;
    var x=padL+(e.i+0.5)*cw;
    if(e.type==='entry'){
      openPos.push(e);
      var ey=Y(e.p)+7;
      ctx.fillStyle='#00E8A2';
      ctx.beginPath();ctx.moveTo(x,ey);ctx.lineTo(x-6,ey+11);ctx.lineTo(x+6,ey+11);ctx.closePath();ctx.fill();
    }else{
      realized+=e.pnl;
      openPos=openPos.filter(function(o){return o.n!==e.n;});
      var entry=null;RP.events.forEach(function(o){if(o.type==='entry'&&o.n===e.n)entry=o;});
      var xy=Y(e.p)-7;
      if(entry){
        ctx.save();ctx.strokeStyle='rgba(0,232,162,.45)';ctx.lineWidth=1;ctx.setLineDash([2,3]);
        ctx.beginPath();ctx.moveTo(padL+(entry.i+0.5)*cw,Y(entry.p));ctx.lineTo(x,Y(e.p));ctx.stroke();ctx.setLineDash([]);ctx.restore();
      }
      ctx.fillStyle='#F0A050';
      ctx.beginPath();ctx.moveTo(x,xy);ctx.lineTo(x-6,xy-11);ctx.lineTo(x+6,xy-11);ctx.closePath();ctx.fill();
      ctx.font='700 '+(narrow?9:10)+'px "DM Mono", monospace';
      ctx.fillStyle='#00E8A2';
      var tagTxt='+$'+e.pnl.toLocaleString(undefined,{minimumFractionDigits:2});
      var tw=ctx.measureText(tagTxt).width;
      if(x+10+tw>W-padR+40){ctx.textAlign='right';ctx.fillText(tagTxt,x-10,xy-14);}
      else{ctx.textAlign='left';ctx.fillText(tagTxt,x+10,xy-14);}
    }
  });
  // ── counters ──
  var markPrice=RP.candles[Math.max(0,Math.min(Math.floor(vis)-1,N-1))].c;
  var open=0;openPos.forEach(function(o){var m=(markPrice-o.p)*2*RP.qty;var tp=null;RP.events.forEach(function(e){if(e.type==='exit'&&e.n===o.n)tp=e.pnl;});if(tp!==null)m=Math.min(m,tp);open+=m;});
  if(ended){open=0;realized=RP.TOTAL;}
  var pnlEl=document.getElementById('rpPnl');
  if(pnlEl){
    var showOpen=openPos.length>0&&!ended;
    var v=showOpen?open:0;
    pnlEl.textContent=(v>=0?'+$':'-$')+Math.abs(Math.round(v)).toLocaleString();
    pnlEl.style.color=showOpen?(v>0?'var(--green)':v<0?'var(--red)':'var(--muted)'):'var(--muted)';
    if(ended){pnlEl.textContent='+$0';pnlEl.style.color='var(--muted)';}
  }
  var sessEl=document.getElementById('rpSess');
  if(sessEl)sessEl.textContent='+$'+realized.toLocaleString(undefined,{minimumFractionDigits:realized%1?2:0,maximumFractionDigits:2});
  var idxEl=document.getElementById('rpIdx');
  if(idxEl){
    var entries=RP.events.filter(function(e){return e.type==='entry'&&vis>=e.i+0.6;}).length;
    idxEl.textContent=ended?'4 FOR 4':(entries?('TRADE '+entries+' / 4'):'SCANNING');
  }
  // ── caption ──
  var cap=document.getElementById('rpCaption');
  if(cap){
    var txt,col;
    if(ended){txt='4 FOR 4 \u00b7 +$1,302.50 \u00b7 JUL 22, 2026 \u00b7 2:30\u20143:15 PM';col='var(--green)';}
    else if(!lastEvent){txt='GAMMA TRACKING MNQ \u00b7 SIGNALS FIRE WHEN PRICE TAGS THE LINE';col='var(--muted)';}
    else if(lastEvent.type==='entry'){txt='SIGNAL FIRED \u00b7 LONG 5 MNQ @ '+rpFmt(lastEvent.p)+' \u00b7 '+lastEvent.tm;col='var(--green)';}
    else{txt='\u2713 TAKE PROFIT @ '+rpFmt(lastEvent.p)+' \u00b7 +$'+lastEvent.pnl.toLocaleString(undefined,{minimumFractionDigits:2})+' IN '+lastEvent.dur;col='var(--green)';}
    cap.textContent=txt;cap.style.color=col;
  }
  if(ended&&!RP.done){RP.done=true;var b=document.getElementById('rpReplay');if(b)b.style.display='block';}
  RP.raf=requestAnimationFrame(rpFrame);
}
function rpDrawCandle(ctx,i,alpha,padL,cw,bw,Y){
  var c=RP.candles[i];if(!c)return;
  var x=padL+(i+0.5)*cw;
  var up=c.c>=c.o;
  ctx.save();ctx.globalAlpha=alpha;
  ctx.strokeStyle=up?'#00E8A2':'#FF4466';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x,Y(c.h));ctx.lineTo(x,Y(c.l));ctx.stroke();
  ctx.fillStyle=up?'rgba(0,232,162,.85)':'rgba(255,68,102,.85)';
  var y1=Y(Math.max(c.o,c.c)),y2=Y(Math.min(c.o,c.c));
  ctx.fillRect(x-bw/2,y1,bw,Math.max(1.5,y2-y1));
  ctx.restore();
}

  h+='<div style="background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:24px 28px;margin-bottom:24px">';
  var assumptions=[["Data source","Databento historical 1-minute MNQ futures OHLCV data for March 1, 2021 \u2014 February 28, 2026 (5 years)."],["Instrument","Micro E-mini Nasdaq-100 futures (MNQ). Front-month contract rolled based on daily volume at each quarterly expiration."],["Bar aggregation","1-minute bars aggregated to 5-minute bars anchored to wall-clock 5-minute boundaries in America/Chicago timezone."],["Strategies tested","Four proprietary long-only mean-reversion strategies executed simultaneously on the same instrument. Each strategy uses a distinct signal threshold and session profile, producing complementary trade patterns across different market conditions. The backtest also applies \"Filter B\" risk control: after two stop-loss exits occur within any 10-minute rolling window across any strategies, all new entries are blocked for 30 minutes. Open positions at the moment the lockout triggers continue with their existing take-profit and stop-loss levels."],["Position sizing","Fixed at 5 contracts per trade per strategy. No scaling with account equity. No reinvestment of profits. Starting equity of $30,000 assumed for drawdown and ROR calculations."],["Entry","Long entries triggered when the 1-minute bar low crossed a proprietary signal threshold. Fill price assumed to be the threshold level itself, with slippage applied separately (see below)."],["Exits","Take-profit levels range from 40 to 75 points depending on strategy. Stop-loss is fixed at 65 points across all strategies."],["Slippage","4 ticks (1 point, $2 per contract) modeled on every fill."],["Commissions","$0.70 per round-turn per contract modeled \u2014 representative of retail futures commissions; actual client commissions vary by FCM and may be higher."],["Same-bar exits","If both take-profit and stop-loss were touched within the same bar, the simulation conservatively assumed the stop-loss was hit first (worst case for the strategy)."],["Concurrency","One open position per strategy at any async function apiCall(method,path,body){
  var opts={method:method,headers:{'Content-Type':'application/json'}};
  var token=getToken();
  if(token)opts.headers['Authorization']='Bearer '+token;
  if(body)opts.body=JSON.stringify(body);
  var res=await fetch(API+path,opts);
  var data=null;try{data=await res.json();}catch(e){data={};}
  if(res.status===401&&token&&path!=='/auth/login'&&path!=='/auth/signup'){
    clearToken();showPage('loginPage');buildLogin();
    setTimeout(function(){if(typeof showLoginError==='function')showLoginError('Your session expired. Please log in again.');},60);
    throw new Error('Session expired');
  }
  if(!res.ok)throw new Error((data&&data.detail)||'Request failed');
  return data;
}
function initDualScrollbars(){
  document.querySelectorAll('.table-wrap').forEach(function(wrap){
    if(wrap.previousElementSibling && wrap.previousElementSibling.classList.contains('table-scroll-top')) return;
    var top=document.createElement('div');
    top.className='table-scroll-top';
    var inner=document.createElement('div');
    inner.style.width=wrap.scrollWidth+'px';
    top.appendChild(inner);
    wrap.parentNode.insertBefore(top,wrap);
    var syncing=false;
    top.addEventListener('scroll',function(){if(!syncing){syncing=true;wrap.scrollLeft=top.scrollLeft;syncing=false;}});
    wrap.addEventListener('scroll',function(){if(!syncing){syncing=true;top.scrollLeft=wrap.scrollLeft;syncing=false;}});
    new ResizeObserver(function(){inner.style.width=wrap.scrollWidth+'px';}).observe(wrap);
  });
}

function fireConfetti(){
  var canvas=document.createElement('canvas');
  canvas.style.cssText='position:fixed;inset:0;z-index:99999;pointer-events:none';
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  document.body.appendChild(canvas);
  var ctx=canvas.getContext('2d');
  var colors=['#00E8A2','#00C4FF','#F0C040','#FF4466','#B070FF','#ffffff'];
  var particles=[];
  for(var i=0;i<120;i++){
    particles.push({
      x:canvas.width*0.5+(Math.random()-0.5)*200,
      y:canvas.height*0.4,
      vx:(Math.random()-0.5)*12,
      vy:-Math.random()*16-4,
      w:Math.random()*8+4,
      h:Math.random()*6+2,
      color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*360,
      rotV:(Math.random()-0.5)*12,
      gravity:0.35+Math.random()*0.15,
      opacity:1
    });
  }
  var start=performance.now();
  function tick(now){
    var elapsed=(now-start)/1000;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    var alive=false;
    particles.forEach(function(p){
      p.vy+=p.gravity;
      p.x+=p.vx;
      p.y+=p.vy;
      p.rot+=p.rotV;
      p.vx*=0.99;
      if(elapsed>2)p.opacity=Math.max(0,p.opacity-0.03);
      if(p.opacity<=0||p.y>canvas.height+50)return;
      alive=true;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.globalAlpha=p.opacity;
      ctx.fillStyle=p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    if(alive&&elapsed<4){requestAnimationFrame(tick);}
    else{canvas.remove();}
  }
  requestAnimationFrame(tick);
}

  var yr=now.getFullYear(),mo=now.getMonth();

(function captureReferralCode(){
  try {
    var params = new URLSearchParams(window.location.search);
    var ref = (params.get('ref') || '').trim().toUpperCase();
    if (ref && /^[A-Z0-9]{4,16}$/.test(ref)) {
      var entry = { code: ref, expires: Date.now() + 60*24*60*60*1000 };
      localStorage.setItem('nq_ref', JSON.stringify(entry));
    }
  } catch(e){}
})();
function getStoredRefCode(){
  try {
    var raw = localStorage.getItem('nq_ref');
    if (!raw) return '';
    var entry = JSON.parse(raw);
    if (!entry || !entry.code) return '';
    if (typeof entry.expires === 'number' && Date.now() > entry.expires) {
      localStorage.removeItem('nq_ref');
      return '';
    }
    return entry.code;
  } catch(e){ return ''; }
}

function icCopyLink(){
  var link = document.getElementById('icRefLink');
  var btn = document.getElementById('icCopyBtn');
  if (!link || !btn) return;
  var url = link.getAttribute('data-url') || link.textContent;
  var done = function(){
    var original = btn.innerHTML;
    btn.innerHTML = '✓ Copied';
    btn.style.background = 'rgba(0,232,162,.15)';
    btn.style.borderColor = 'var(--green)';
    btn.style.color = 'var(--green)';
    setTimeout(function(){
      btn.innerHTML = original;
      btn.style.background = '';
      btn.style.borderColor = '';
      btn.style.color = '';
    }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(function(){
      try { var ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done(); } catch(e){}
    });
  } else {
    try { var ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done(); } catch(e){}
  }
}

}

async function adminAdjustCredit(investorId){
  var amtEl = document.getElementById('ar-amt-'+investorId);
  var reasonEl = document.getElementById('ar-reason-'+investorId);
  var resultEl = document.getElementById('ar-result-'+investorId);
  var amtDollars = parseFloat((amtEl && amtEl.value) || '');
  var reason = ((reasonEl && reasonEl.value) || '').trim();
  if (!amtDollars || isNaN(amtDollars)) {
    if (resultEl) { resultEl.textContent = '\u26a0 Enter a non-zero dollar amount'; resultEl.style.color = 'var(--red)'; }
    return;
  }
  if (!reason) {
    if (resultEl) { resultEl.textContent = '\u26a0 Reason is required for the audit log'; resultEl.style.color = 'var(--red)'; }
    return;
  }
  var deltaCents = Math.round(amtDollars * 100);
  if (resultEl) { resultEl.textContent = 'Applying...'; resultEl.style.color = 'var(--muted)'; }
  try {
    var resp = await adminApi('POST','/admin/referrals/adjust',{investor_id: investorId, delta_cents: deltaCents, reason: reason});
    if (resp && resp.success) {
      if (resultEl) { resultEl.textContent = '\u2713 Adjusted. New balance: $'+((resp.new_credit_balance_cents||0)/100).toFixed(2); resultEl.style.color = 'var(--green)'; }
      if (amtEl) amtEl.value = '';
      if (reasonEl) reasonEl.value = '';
      setTimeout(function(){ switchAdminTab('referrals'); }, 1200);
    } else {
      if (resultEl) { resultEl.textContent = '\u26a0 '+((resp && resp.error) || 'Failed'); resultEl.style.color = 'var(--red)'; }
    }
  } catch(e) {
    if (resultEl) { resultEl.textContent = '\u26a0 '+(e.message || 'Request failed'); resultEl.style.color = 'var(--red)'; }
  }
}
async function adminReviewReferral(referralId, action){
  if (!confirm('Confirm '+action.toUpperCase()+' on referral #'+referralId+'?')) return;
  try {
    await adminApi('POST','/admin/referrals/review',{referral_id: referralId, action: action});
    switchAdminTab('referrals');
  } catch(e){ alert('Review failed: '+(e.message||'')); }
}

var faqs=[
{cat:'Getting Started',color:'var(--green)',items:[
{q:'What is NQ Alpha?',a:'NQ Alpha is an automated futures trading system that trades Micro E-Mini Nasdaq (MNQ) futures. When you connect your Tradovate account, our system automatically copies every trade to your account in real time — no manual intervention required.'},
{q:'How do I get started?',a:'There are four steps: <strong>1)</strong> Create your account and get approved (usually within 24 hours). <strong>2)</strong> Connect your Tradovate brokerage account using your API credentials. <strong>3)</strong> Set your position size (how many contracts per trade). <strong>4)</strong> Add a payment method. Once connected, trades are copied automatically.'},
{q:'Do I need trading experience?',a:'No. The system is fully automated — you don\'t need to make any trading decisions. However, you should understand that futures trading involves significant risk and you can lose more than your initial investment. Read the Risk Disclosure carefully before connecting a live account.'},
{q:'What are the trading hours?',a:'NQ Alpha trades during the Nasdaq futures session, which runs nearly 24 hours on weekdays (Sunday evening through Friday afternoon CT). There is a brief daily maintenance window. Markets are closed on weekends and major holidays.'},
]},
{cat:'Understanding Futures',color:'var(--gold)',items:[
{q:'What are futures contracts?',a:'Futures are financial contracts that obligate the buyer or seller to transact an asset at a predetermined price on a future date. Unlike stocks, futures use <strong>leverage</strong> — meaning you control a large position with a relatively small amount of capital (called margin). This amplifies both gains and losses.'},
{q:'What is the Micro E-Mini Nasdaq (MNQ)?',a:'The MNQ is a futures contract that tracks the Nasdaq-100 index at <strong>1/10th the size</strong> of the standard E-Mini (NQ). Each point of movement is worth <strong>$2 per contract</strong>. It\'s popular with individual traders because of its smaller size and lower margin requirements compared to the full-size contract.'},
{q:'What is margin in futures trading?',a:'Margin is the amount of capital required to hold a futures position. It\'s not a down payment — it\'s a performance bond. For MNQ, the margin requirement varies by broker but is typically between <strong>$1,000–$2,000 per contract</strong>. If your account falls below the maintenance margin, you\'ll receive a margin call and may need to deposit more funds or have positions liquidated.'},
{q:'What does "going long" vs "going short" mean?',a:'<strong>Going long</strong> means buying a contract with the expectation that the price will rise — you profit when the market goes up. <strong>Going short</strong> means selling a contract expecting the price to fall — you profit when the market goes down. Futures allow you to trade in both directions equally.'},
{q:'What are take-profit and stop-loss orders?',a:'A <strong>take-profit (TP)</strong> is a limit order that automatically closes your position when it reaches a target profit level. A <strong>stop-loss (SL)</strong> is a stop order that closes your position to limit losses if the market moves against you. Every trade placed by NQ Alpha includes both a TP and SL as bracket orders, so exits are handled automatically.'},
{q:'How much can I lose on a single trade?',a:'Your maximum loss per trade depends on the stop-loss distance and the number of contracts you\'re trading. For example, if the stop-loss is 65 points away and you\'re trading 2 MNQ contracts, the max loss would be 65 × $2 × 2 = <strong>$260</strong>. This is set before the trade is placed — there are no surprises.'},
]},
{cat:'Position Sizing',color:'var(--cyan)',items:[
{q:'How many contracts will I trade?',a:'You control this in the Connect tab. You can choose <strong>Multiplier mode</strong> (a percentage of the master account) or <strong>Fixed mode</strong> (always trade a set number of contracts). The minimum is always 1 contract.'},
{q:'What position size should I start with?',a:'Start conservative. A good rule of thumb is to risk no more than <strong>1–2% of your account</strong> on any single trade. If your account is $10,000 and max loss per contract is around $130, that\'s roughly 1 contract. You can always increase later once you\'re comfortable with the system.'},
{q:'Can I change my position size?',a:'Yes, anytime. Go to the <strong>Connect</strong> tab and change your contract count. Changes take effect on the next trade — any open positions will keep their original size.'},
{q:'What\'s the difference between Multiplier and Fixed mode?',a:'<strong>Multiplier mode</strong> scales your contracts as a percentage of the master account. If the master trades more contracts, your size scales up proportionally. <strong>Fixed mode</strong> always trades the exact number of contracts you specify, regardless of what the master does. Fixed mode gives you more predictable risk.'},
]},
{cat:'Tradovate Connection',color:'var(--green)',items:[
{q:'How do I get Tradovate API credentials?',a:'<strong>1)</strong> Log in to <a href="https://trader.tradovate.com" target="_blank" style="color:var(--cyan)">trader.tradovate.com</a>. <strong>2)</strong> Go to <strong>Settings → API Access</strong>. <strong>3)</strong> Create a new API key — you\'ll get a <em>Username</em>, <em>App ID</em>, <em>CID</em>, and <em>API Secret</em>. <strong>4)</strong> Copy all four values into the Connect tab in your NQ Alpha dashboard. Your password is your Tradovate account password.'},
{q:'Should I use Demo or Live mode?',a:'We recommend starting on <strong>Demo</strong> to see the system in action with paper money. Once you\'re comfortable, switch to <strong>Live</strong> to trade with real capital. You can switch between modes at any time from the Connect tab.'},
{q:'Are my Tradovate credentials secure?',a:'Yes. Your credentials are encrypted at rest using AES-256 encryption before being stored. They are only decrypted in memory when the trade copier needs to execute a trade on your behalf. We never store plaintext passwords.'},
{q:'What happens if my connection drops?',a:'If your Tradovate session expires or disconnects, the copier automatically attempts to reconnect every 60 seconds. If it can\'t reconnect, no trades will be placed on your account until the connection is restored. You\'ll see your connection status on the Overview tab.'},
{q:'Do I need a funded Tradovate account?',a:'For <strong>Demo mode</strong>, no — Tradovate provides a simulated account with paper money. For <strong>Live mode</strong>, yes — you\'ll need a funded account with enough margin to cover your position size. Check with Tradovate for their current margin requirements on MNQ contracts.'},
]},
{cat:'Billing & Fees',color:'var(--cyan)',items:[
{q:'How does billing work?',a:'NQ Alpha has two components: <strong>1) A one-time access fee</strong> of $2,500 per product (MNQ and/or MES — $5,000 for both). <strong>2) $400 per contract, per 30-day cycle</strong>, charged only if the cycle is profitable. Your first charge lands 30 days after going live, and each cycle runs 30 days from your last invoice. Demo mode is completely free.'},
{q:'What are the one-time product fees?',a:'Each product (MNQ or MES) requires a <strong>$2,500 one-time access fee</strong> to unlock. You can purchase one or both. This fee grants you permanent access to that product\'s trading strategies. The $5,000 bundle gets you both MNQ and MES access.'},
{q:'How much will I actually pay each cycle?',a:'It depends only on whether the cycle was profitable. At the end of each 30-day cycle, we look at your realized P&L from bot trades: <strong>1) Profitable cycle</strong> (gross P&L > 0) → you pay $400 per contract used, where contracts = the highest number of contracts the bot held open at once during the cycle. <strong>2) Flat or losing cycle</strong> → you pay $0. Example: bot uses 3 contracts at its peak and ends the cycle +$650 realized → fee is 3 × $400 = $1,200. Same setup but cycle ends -$200 → fee is $0.'},
{q:'How is the contract count determined?',a:'Your fee is based on the <strong>highest number of contracts</strong> used on any single trade within your 30-day cycle. If you traded 1 contract on most days but scaled to 3 contracts on one trade, your fee is calculated on 3 contracts ($3,000 at full tier, $1,500 at 50% tier). You can adjust your max contract setting at any time from the Connect tab.'},
{q:'What counts as "profit"?',a:'Realized P&L from closed bot trades during your 30-day cycle — exactly what you see on your P&L Tracker tab. Open positions don\'t count until they close. Tradovate commissions and your own account adjustments aren\'t part of this calculation — only the cumulative P&L from NQ Alpha bot trades.'},
{q:'What if the bot doesn\'t trade during my cycle?',a:'If the bot doesn\'t place any trades during your 30-day cycle — paused, disconnected, or any other reason — your realized P&L is $0, which means <strong>you pay nothing</strong> for that cycle.'},
{q:'What happens if I disconnect early?',a:'If you disconnect your Tradovate account mid-cycle, you\'re billed based on the bot\'s realized P&L and highest contracts used up to that point. No penalties, no "still owed" fees — just the normal three-tier calculation based on what happened before you disconnected.'},
{q:'Can I cancel anytime?',a:'Yes. You can disconnect your Tradovate account at any time. The one-time product access fees are non-refundable, but there are no lock-in contracts or cancellation fees on the cycle billing. You only ever pay based on actual bot performance.'},
{q:'Do you offer promo codes?',a:'Yes! If you have a promo code, you can apply it in the <strong>Billing</strong> tab. Promos can include free product access, contract fee credits, or both. Each investor can only use one promo code.'},
{q:'Is my payment information secure?',a:'All payments are handled by <strong>Stripe</strong>, a PCI-compliant payment processor. NQ Alpha never sees or stores your full card number. All checkout happens securely through Stripe\'s hosted payment page.'},
]},
{cat:'Account & Support',color:'var(--gold)',items:[
{q:'How do I update my profile?',a:'Go to the <strong>Settings</strong> tab in your dashboard. You can update your name and phone number. Email changes require contacting support.'},
{q:'What if I forget my password?',a:'Contact support at <a href="mailto:support@nqalpha.com" style="color:var(--cyan)">support@nqalpha.com</a> to reset your password. We\'re working on adding self-service password reset soon.'},
{q:'How do I contact support?',a:'Email <a href="mailto:support@nqalpha.com" style="color:var(--cyan)">support@nqalpha.com</a> for any questions, issues, or feedback. We aim to respond within 24 hours.'},
{q:'What does the "My Journey" tab track?',a:'My Journey is your personal achievement tracker. It automatically unlocks milestones as you trade — first win, win streaks, P&L milestones, and more. You can share achievement cards on social media directly from the tab.'},
]},
];

// Main entry — fetches data from API and renders/updates the chart
// userTriggered=true means user clicked refresh, so show "Refreshing..." briefly
async function renderLiveChart(userTriggered){
  // Bail if not on chart tab anymore
  if(dashTab!=='chart')return;
  var container=document.getElementById('liveChartContainer');
  if(!container)return;

  // Verify Lightweight Charts library loaded
  if(typeof LightweightCharts==='undefined'){
    setChartStatus('— LIBRARY ERROR —','var(--red)');
    var loading=document.getElementById('liveChartLoading');
    if(loading)loading.innerHTML='<div style="text-align:center;padding:0 32px"><div style="font-family:var(--mono);font-size:10px;color:var(--red);letter-spacing:2px;margin-bottom:14px">LIBRARY ERROR</div><div style="font-size:14px;color:var(--white);margin-bottom:8px">Chart library failed to load</div><div style="font-family:var(--mono);font-size:11px;color:var(--muted)">Please refresh the page to try again</div></div>';
    return;
  }

  if(userTriggered)setChartStatus('— REFRESHING —','var(--cyan)');
  else if(!window._liveChart)setChartStatus('— LOADING —','var(--muted)');

  // Fetch data from backend
  var data;
  try{
    data=await apiCall('GET','/investor/chart-data');
  }catch(e){
    setChartStatus('— FETCH ERROR —','var(--red)');
    var loading=document.getElementById('liveChartLoading');
    if(loading)loading.innerHTML='<div style="text-align:center;padding:0 32px"><div style="font-family:var(--mono);font-size:10px;color:var(--red);letter-spacing:2px;margin-bottom:14px">FETCH ERROR</div><div style="font-size:14px;color:var(--white);margin-bottom:8px">Could not load chart data</div><div style="font-family:var(--mono);font-size:11px;color:var(--muted)">'+(e.message||'Unknown error')+'</div></div>';
    return;
  }

  // No data case (e.g. weekend, market closed, no bars in window)
  if(!data.candles||data.candles.length===0){
    setChartStatus('— NO DATA —','var(--muted)');
    var loading=document.getElementById('liveChartLoading');
    if(loading){loading.style.display='flex';loading.innerHTML='<div style="text-align:center;padding:0 32px"><div style="font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:2px;margin-bottom:14px">MARKET CLOSED</div><div style="font-size:16px;font-weight:600;color:var(--white);margin-bottom:8px">No recent market data</div><div style="font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.7;max-width:320px;margin:0 auto">MNQ futures trade Sunday 5:00 PM CT through Friday 4:00 PM CT. Market data will resume when the session reopens.</div></div>';}
    if(window._liveChart){destroyLiveChart();}
    return;
  }

  // Create the chart if it doesn't exist yet
  if(!window._liveChart){
    var loading=document.getElementById('liveChartLoading');
    if(loading)loading.style.display='none';
    try{
      window._liveChart=LightweightCharts.createChart(container,{
        width:container.clientWidth,
        height:container.clientHeight||520,
        layout:{
          background:{type:'solid',color:'transparent'},
          textColor:'#B8C8D8',
          fontFamily:"'DM Mono',monospace",
          fontSize:11,
        },
        grid:{
          vertLines:{color:'rgba(22,32,48,0.5)'},
          horzLines:{color:'rgba(22,32,48,0.5)'},
        },
        rightPriceScale:{
          borderColor:'#162030',
          textColor:'#B8C8D8',
        },
        timeScale:{
          borderColor:'#162030',
          textColor:'#B8C8D8',
          timeVisible:true,
          secondsVisible:false,
        },
        crosshair:{
          mode:LightweightCharts.CrosshairMode.Normal,
          vertLine:{color:'#00C4FF',width:1,style:LightweightCharts.LineStyle.Dashed,labelBackgroundColor:'#00C4FF'},
          horzLine:{color:'#00C4FF',width:1,style:LightweightCharts.LineStyle.Dashed,labelBackgroundColor:'#00C4FF'},
        },
        handleScroll:true,
        handleScale:true,
      });
      window._liveCandleSeries=window._liveChart.addCandlestickSeries({
        upColor:'#00E8A2',
        downColor:'#FF4466',
        borderUpColor:'#00E8A2',
        borderDownColor:'#FF4466',
        wickUpColor:'#00E8A2',
        wickDownColor:'#FF4466',
      });
      // Handle window resize
      window._liveChartResizeHandler=function(){
        if(window._liveChart&&container){
          window._liveChart.applyOptions({width:container.clientWidth,height:container.clientHeight||520});
        }
      };
      window.addEventListener('resize',window._liveChartResizeHandler);
    }catch(e){
      setChartStatus('— INIT FAILED —','var(--red)');
      console.error('Chart init error:',e);
      return;
    }
  }

  // Update candle data
  try{
    window._liveCandleSeries.setData(data.candles);
  }catch(e){
    setChartStatus('— RENDER ERROR —','var(--red)');
    console.error('setData error:',e);
    return;
  }

  // Update markers (entry/exit arrows on each trade)
  try{
    window._liveCandleSeries.setMarkers(data.markers||[]);
  }catch(e){
    console.error('setMarkers error:',e);
  }

  // Fit content on first render only — subsequent refreshes keep user's zoom/pan
  if(userTriggered||!window._liveChartFitted){
    window._liveChart.timeScale().fitContent();
    window._liveChartFitted=true;
  }

  // Update status text
  var n=data.candles.length;
  var m=data.markers?data.markers.length:0;
  setChartStatus(n+' BARS · '+m+' MARKERS','var(--green)');

  // Set up auto-refresh on first render
  if(!window._liveChartTimer){
    window._liveChartTimer=setInterval(function(){
      if(dashTab==='chart'){renderLiveChart(false);}
      else{destroyLiveChart();}
    },60000);
  }
}

function drawLiveEqChart(){
  var c=document.getElementById('liveEqChart');if(!c)return;
  var data=window._pnlEqCurve||[];if(data.length<2)return;
  var x=c.getContext('2d');var dpr=window.devicePixelRatio||1;
  var r=c.getBoundingClientRect();c.width=r.width*dpr;c.height=220*dpr;x.scale(dpr,dpr);
  var W=r.width,H=220;
  var vals=data.map(function(d){return d.cumulative;});
  var mn=Math.min.apply(null,vals.concat([0])),mx=Math.max.apply(null,vals);
  var rng=mx-mn||1;
  var pad={t:20,r:80,b:30,l:10},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;

  // Grid lines
  x.strokeStyle='#182030';x.lineWidth=0.5;
  for(var i=0;i<=5;i++){
    var y=pad.t+(ch/5)*i;
    x.beginPath();x.moveTo(pad.l,y);x.lineTo(W-pad.r,y);x.stroke();
    var v=mx-(rng/5)*i;
    x.fillStyle='#3d5570';x.font='10px DM Mono';x.textAlign='right';
    x.fillText((v>=0?'+':'')+fmtD(Math.round(v)),W-pad.r+70,y+4);
  }

  // Zero line
  if(mn<0){
    var zy=pad.t+((mx-0)/rng)*ch;
    x.strokeStyle='#3d5570';x.setLineDash([4,4]);
    x.beginPath();x.moveTo(pad.l,zy);x.lineTo(W-pad.r,zy);x.stroke();
    x.setLineDash([]);
  }

  // Area fill
  x.beginPath();
  for(var i=0;i<vals.length;i++){
    var px=pad.l+(i/(vals.length-1))*cw;
    var py=pad.t+((mx-vals[i])/rng)*ch;
    if(i===0)x.moveTo(px,py);else x.lineTo(px,py);
  }
  x.lineTo(pad.l+cw,pad.t+ch);x.lineTo(pad.l,pad.t+ch);x.closePath();
  var last=vals[vals.length-1];
  var gColor=last>=0?'0,232,162':'255,68,102';
  var g=x.createLinearGradient(0,pad.t,0,H);
  g.addColorStop(0,'rgba('+gColor+',0.15)');g.addColorStop(1,'rgba('+gColor+',0)');
  x.fillStyle=g;x.fill();

  // Line
  x.beginPath();
  for(var i=0;i<vals.length;i++){
    var px=pad.l+(i/(vals.length-1))*cw;
    var py=pad.t+((mx-vals[i])/rng)*ch;
    if(i===0)x.moveTo(px,py);else x.lineTo(px,py);
  }
  x.strokeStyle=last>=0?'#00E8A2':'#FF4466';x.lineWidth=2;x.stroke();

  // End dot
  var lx=pad.l+cw;var ly=pad.t+((mx-last)/rng)*ch;
  x.beginPath();x.arc(lx,ly,5,0,Math.PI*2);
  x.fillStyle=last>=0?'#00E8A2':'#FF4466';x.fill();
  x.beginPath();x.arc(lx,ly,5,0,Math.PI*2);
  x.strokeStyle='#04080D';x.lineWidth=2;x.stroke();

  // Hover interaction
  c.onmousemove=function(e){
    var rect=c.getBoundingClientRect();var rx=e.clientX-rect.left-pad.l;
    var idx=Math.round((rx/cw)*(vals.length-1));
    if(idx<0||idx>=vals.length){drawLiveEqChart();return;}
    drawLiveEqChart();
    var hx=pad.l+(idx/(vals.length-1))*cw;
    var hy=pad.t+((mx-vals[idx])/rng)*ch;
    // Crosshair
    x.strokeStyle='rgba(0,232,162,0.25)';x.lineWidth=1;x.setLineDash([3,3]);
    x.beginPath();x.moveTo(hx,pad.t);x.lineTo(hx,pad.t+ch);x.stroke();x.setLineDash([]);
    // Dot
    x.beginPath();x.arc(hx,hy,6,0,Math.PI*2);x.fillStyle='rgba(0,232,162,0.15)';x.fill();
    x.beginPath();x.arc(hx,hy,4,0,Math.PI*2);x.fillStyle=vals[idx]>=0?'#00E8A2':'#FF4466';x.fill();
    x.beginPath();x.arc(hx,hy,4,0,Math.PI*2);x.strokeStyle='#04080D';x.lineWidth=1.5;x.stroke();
    // Label
    var d=data[idx];
    x.fillStyle=vals[idx]>=0?'#00E8A2':'#FF4466';x.font='bold 12px DM Mono';x.textAlign='center';
    x.fillText((vals[idx]>=0?'+':'')+fmtD(vals[idx]),hx,hy-14);
    x.fillStyle='#405060';x.font='9px DM Mono';
    x.fillText(d.strategy+' '+d.result,hx,hy-28);
  };
  c.onmouseleave=function(){drawLiveEqChart();};
}

function drawDailyPnlChart(){
  var c=document.getElementById('dailyPnlChart');if(!c)return;
  var data=window._pnlDailyPnl||[];if(data.length===0)return;
  var x=c.getContext('2d');var dpr=window.devicePixelRatio||1;
  var r=c.getBoundingClientRect();c.width=r.width*dpr;c.height=180*dpr;x.scale(dpr,dpr);
  var W=r.width,H=180;
  var vals=data.map(function(d){return d.pnl;});
  var absMax=Math.max.apply(null,vals.map(Math.abs));if(absMax===0)absMax=1;
  var pad={t:10,r:10,b:24,l:10},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  var barW=Math.max(2,Math.min(24,(cw/vals.length)-2));
  var midY=pad.t+ch/2;

  // Zero line
  x.strokeStyle='#2a3545';x.lineWidth=1;
  x.beginPath();x.moveTo(pad.l,midY);x.lineTo(W-pad.r,midY);x.stroke();

  // Bars
  for(var i=0;i<vals.length;i++){
    var bx=pad.l+(i/(vals.length))*(cw-barW);
    var v=vals[i];
    var barH=Math.abs(v)/absMax*(ch/2-4);
    if(barH<1)barH=1;
    var by=v>=0?midY-barH:midY;
    var col=v>=0?'#00E8A2':'#FF4466';
    x.fillStyle=col+'90';
    x.beginPath();
    // Rounded rect
    var radius=Math.min(3,barW/2);
    x.moveTo(bx+radius,by);
    x.lineTo(bx+barW-radius,by);
    x.quadraticCurveTo(bx+barW,by,bx+barW,by+radius);
    x.lineTo(bx+barW,by+barH-radius);
    x.quadraticCurveTo(bx+barW,by+barH,bx+barW-radius,by+barH);
    x.lineTo(bx+radius,by+barH);
    x.quadraticCurveTo(bx,by+barH,bx,by+barH-radius);
    x.lineTo(bx,by+radius);
    x.quadraticCurveTo(bx,by,bx+radius,by);
    x.fill();
  }

  // Date labels (first, middle, last)
  x.fillStyle='#405060';x.font='9px DM Mono';x.textAlign='center';
  if(data.length>0){
    x.textAlign='left';
    x.fillText(data[0].day,pad.l,H-4);
  }
  if(data.length>2){
    var mi=Math.floor(data.length/2);
    x.textAlign='center';
    x.fillText(data[mi].day,W/2,H-4);
  }
  if(data.length>1){
    x.textAlign='right';
    x.fillText(data[data.length-1].day,W-pad.r,H-4);
  }

  // Hover
  c.onmousemove=function(e){
    var rect=c.getBoundingClientRect();var rx=e.clientX-rect.left-pad.l;
    var idx=Math.floor((rx/cw)*vals.length);
    if(idx<0||idx>=vals.length){drawDailyPnlChart();return;}
    drawDailyPnlChart();
    var bx=pad.l+(idx/(vals.length))*(cw-barW);
    var v=vals[idx];var d=data[idx];
    // Highlight bar
    var barH=Math.abs(v)/absMax*(ch/2-4);if(barH<1)barH=1;
    var by=v>=0?midY-barH:midY;
    x.fillStyle=v>=0?'#00E8A2':'#FF4466';
    x.fillRect(bx,by,barW,barH);
    // Tooltip
    x.fillStyle='#fff';x.font='bold 11px DM Mono';x.textAlign='center';
    var tx=bx+barW/2;var ty=v>=0?by-18:by+barH+16;
    x.fillText((v>=0?'+':'')+fmtD(v),tx,ty);

function drawDashEq(){
var c=document.getElementById('dashEq');if(!c)return;
var x=c.getContext('2d');var dpr=window.devicePixelRatio||1;
var r=c.getBoundingClientRect();c.width=r.width*dpr;c.height=180*dpr;x.scale(dpr,dpr);
var W=r.width,H=180,data=D.eq;
var mn=Math.min.apply(null,data.concat([0])),mx=Math.max.apply(null,data),rng=mx-mn||1;
var pad={t:10,r:10,b:10,l:10},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
x.beginPath();for(var i=0;i<data.length;i++){var px=pad.l+(i/(data.length-1))*cw;var py=pad.t+((mx-data[i])/rng)*ch;if(i===0)x.moveTo(px,py);else x.lineTo(px,py);}
x.lineTo(pad.l+cw,pad.t+ch);x.lineTo(pad.l,pad.t+ch);x.closePath();
var g=x.createLinearGradient(0,pad.t,0,H);g.addColorStop(0,'rgba(0,232,162,0.12)');g.addColorStop(1,'rgba(0,232,162,0)');x.fillStyle=g;x.fill();
x.beginPath();for(var i=0;i<data.length;i++){var px=pad.l+(i/(data.length-1))*cw;var py=pad.t+((mx-data[i])/rng)*ch;if(i===0)x.moveTo(px,py);else x.lineTo(px,py);}
x.strokeStyle='#00E8A2';x.lineWidth=2;x.stroke();
}

async function doAdminLogin(){
  var pass=document.getElementById('adminPass').value;

  try{

    if(data.token){

async function adminApi(method,path,body){
  var token=ADMIN_KEY_STORED||localStorage.getItem('nq_admin_token');
  var opts={method:method,headers:{'Content-Type':'application/json','x-admin-key':token}};
  if(body)opts.body=JSON.stringify(body);
  var res=await fetch(API+path,opts);
  var data=null;try{data=await res.json();}catch(e){data={};}
  if((res.status===401||res.status===403)&&token){
    ADMIN_KEY_STORED=null;localStorage.removeItem('nq_admin_token');
    showPage('adminPage');buildAdminLogin();
    setTimeout(function(){var er=document.getElementById('adminLoginErr');if(er){er.textContent='Admin session expired. Sign in again.';er.style.display='block';}},60);
    throw new Error('Admin session expired');
  }
  if(!res.ok)throw new Error((data&&data.detail)||'Request failed');
  return data;
}

    h+='<td style="color:var(--white);font-weight:600">'+(inv.name||'—')+'</td>';
    h+='<td style="color:var(--text)">'+inv.email+'</td>';
    h+='<td style="color:var(--text);font-family:var(--mono);font-size:11px">'+(inv.phone||'—')+'</td>';
    var ref=inv.referral||'—';
    var refCol='var(--muted)';
    if(ref.startsWith('instagram'))refCol='#E1306C';
    else if(ref.startsWith('friend'))refCol='var(--green)';
    else if(ref.startsWith('other'))refCol='var(--cyan)';
    else if(ref!=='—')refCol='var(--text)';
    h+='<td><span style="font-family:var(--mono);font-size:10px;color:'+refCol+'">'+(ref||'—')+'</span></td>';
    h+='<td style="color:var(--muted)">'+joined+'</td>';
    h+='<td><span style="padding:3px 10px;border-radius:5px;font-size:10px;font-weight:700;'+(approved?'background:rgba(0,232,162,.08);color:var(--green)':'background:rgba(240,192,64,.08);color:var(--gold)')+'">'+( approved?'APPROVED':'PENDING')+'</span></td>';
    h+='<td><span style="padding:3px 10px;border-radius:5px;font-size:10px;font-weight:700;'+(connected?'background:rgba(0,196,255,.08);color:var(--cyan)':'background:rgba(64,80,96,.15);color:var(--muted)')+'">'+( connected?'CONNECTED':'NOT CONNECTED')+'</span></td>';
    h+='<td><span style="padding:3px 10px;border-radius:5px;font-size:10px;font-weight:700;'+(connected?(isLive?'background:rgba(255,68,102,.08);color:var(--red)':'background:rgba(240,192,64,.08);color:var(--gold)'):'background:rgba(64,80,96,.15);color:var(--muted)')+'">'+( connected?(isLive?'LIVE':'DEMO'):'—')+'</span></td>';
    h+='<td style="color:var(--muted);font-family:var(--mono);font-size:10px">'+liveSince+'</td>';
    h+='<td style="color:var(--text);font-family:var(--mono);font-size:11px">'+pos+'</td>';
    h+='<td style="color:'+(pnl>=0?'var(--green)':'var(--red)')+';font-weight:600">'+(pnl>=0?'+':'')+fmtD(pnl)+'</td>';
    h+='<td><div style="display:flex;gap:6px">';
    if(!approved){
      h+='<button onclick="adminAction(\'approve\','+inv.id+')" style="font-family:var(--mono);font-size:10px;padding:5px 14px;background:var(--green);border:none;border-radius:6px;color:var(--bg);font-weight:700;cursor:pointer">APPROVE</button>';
    } else {
      if(connected){
        h+='<button onclick="adminAction(\'pause\','+inv.id+')" style="font-family:var(--mono);font-size:10px;padding:5px 12px;background:transparent;border:1px solid rgba(240,192,64,.3);border-radius:6px;color:var(--gold);cursor:pointer" title="Pause trade copying">⏸ PAUSE</button>';
      } else if(inv.tv_username){
        h+='<button onclick="adminAction(\'resume\','+inv.id+')" style="font-family:var(--mono);font-size:10px;padding:5px 12px;background:transparent;border:1px solid rgba(0,232,162,.3);border-radius:6px;color:var(--green);cursor:pointer" title="Resume trade copying">▶ RESUME</button>';
      }
      h+='<button onclick="adminAction(\'revoke\','+inv.id+')" style="font-family:var(--mono);font-size:10px;padding:5px 14px;background:transparent;border:1px solid rgba(255,68,102,.25);border-radius:6px;color:var(--red);cursor:pointer">REVOKE</button>';
    }
    h+='<button onclick="adminAction(\'delete\','+inv.id+')" style="font-family:var(--mono);font-size:10px;padding:5px 10px;background:transparent;border:1px solid var(--bd);border-radius:6px;color:var(--muted);cursor:pointer">✕</button>';
    h+='</div></td>';
    h+='</tr>';
  });
  h+='</tbody></table></div></div>';
  return h;
}

async function adminAction(action, investorId){
  if(action==='delete' && !confirm('Permanently delete this investor? This cannot be undone.')) return;
  if(action==='revoke' && !confirm('Revoke this investor\'s access?')) return;
  if(action==='pause' && !confirm('Pause trade copying for this investor? They stay approved but no trades will be copied.')) return;
  try{
    if(action==='approve') await adminApi('POST','/admin/approve/'+investorId);
    else if(action==='revoke') await adminApi('POST','/admin/revoke/'+investorId);
    else if(action==='delete') await adminApi('DELETE','/admin/investor/'+investorId);
    else if(action==='pause') await adminApi('POST','/admin/pause/'+investorId);
    else if(action==='resume') await adminApi('POST','/admin/resume/'+investorId);
    await renderAdminContent();
  }catch(e){alert('Error: '+e.message);}
}

async function saveMasterContracts(){
  var STRATS=['VWAP30','VWAP28','VWAP25','SMA25'];
  var payload={};
  for(var i=0;i<STRATS.length;i++){
    var s=STRATS[i];
    var el=document.getElementById('mc_'+s);
    if(!el) return;
    var v=parseInt(el.value,10);
    if(isNaN(v)||v<1||v>50){
      var st=document.getElementById('mcStatus');
      if(st){st.textContent=s+' must be 1–50';st.style.color='var(--red)';}
      return;
    }
    payload[s]=v;
  }
  var summary=STRATS.map(function(s){return s+'='+payload[s];}).join(', ');
  if(!confirm('Update master contracts to:\n'+summary+'\n\nFollowers will NOT be affected.'))return;
  var st=document.getElementById('mcStatus');
  if(st){st.textContent='Saving…';st.style.color='var(--muted)';}
  try{
    await adminApi('POST','/admin/master-contracts',payload);
    if(st){st.textContent='✅ Saved — effective on next signal';st.style.color='var(--green)';}
    setTimeout(function(){switchAdminTab('master_account');},800);
  }catch(e){
    if(st){st.textContent='Save failed: '+(e.message||'error');st.style.color='var(--red)';}
  }
}

async function toggleMaintenance(enable){
  var confirmMsg = enable 
    ? "🚧 Enable maintenance mode?\n\nAll investor dashboards will show an \"Under Maintenance\" banner. The bot will keep trading normally.\n\nContinue?"
    : "Disable maintenance mode?\n\nInvestor dashboards will be restored immediately.\n\nContinue?";
  if(!confirm(confirmMsg)) return;
  var btn = document.getElementById('maintBtn');
  if(btn){ btn.disabled = true; btn.textContent = enable ? "Enabling..." : "Disabling..."; }
  try{
    var endpoint = enable ? '/admin/maintenance-enable' : '/admin/maintenance-disable';
    await adminApi('POST', endpoint, {});
    await switchAdminTab('master_account');
  }catch(e){
    alert("Failed to toggle maintenance mode: " + e.message);
    if(btn){ btn.disabled = false; btn.textContent = enable ? "🚧 MAINTENANCE MODE" : "🚧 MAINT ON — DISABLE"; }
  }
}

async function reconcileTrades(){
  var btn=document.getElementById('reconcileBtn');
  if(btn){btn.textContent='⏳ Reconciling...';btn.disabled=true;}
  try{
    var result=await adminApi('POST','/admin/reconcile-trades',{});
    if(result.success){
      var msg='';
      var dupes=result.duplicates_removed||0;
      if(result.fixed>0||dupes>0){
        msg+='✅ Reconciliation Complete:\n\n';
        if(dupes>0) msg+='🗑 Removed '+dupes+' duplicate investor trades\n\n';
        // Master changes
        if(result.master&&result.master.changes&&result.master.changes.length>0){
          msg+='MASTER:\n';
          result.master.changes.forEach(function(c){
            msg+='  #'+c.trade_id+' '+c.strategy+': $'+c.old_pnl+' → $'+c.new_pnl+'\n';
          });
        }
        // Follower changes
        if(result.followers){
          result.followers.forEach(function(f){
            if(f.changes&&f.changes.length>0){
              msg+='\n'+f.investor_name+':\n';
              f.changes.forEach(function(c){
                msg+='  #'+c.trade_id+': $'+c.old_pnl+' → $'+c.new_pnl+'\n';
              });
            }
          });
        }
        if(!msg.includes('MASTER')&&!msg.includes(':\n  #')) msg+='All P&L values match Tradovate\n';
        alert(msg);
      } else {
        var masterMatch=result.master?result.master.matched:0;
        var followerMatch=result.followers?result.followers.reduce(function(a,f){return a+f.matched;},0):0;
        alert('✅ All trades match Tradovate\n\nMaster: '+masterMatch+' matched\nFollowers: '+followerMatch+' matched');
      }
      await switchAdminTab('master');
    } else {
      alert('Error: '+(result.error||'Unknown error'));
    }
  }catch(e){alert('Error: '+e.message);}
  if(btn){btn.textContent='⚡ Reconcile P&L';btn.disabled=false;}
}
