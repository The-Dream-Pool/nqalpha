<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#04080D">
<title>NQ Alpha City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04080D; --sf:#0A1018; --sf2:#0E1620; --bd:#162030;
  --white:#F0F4F8; --text:#B8C8D8; --muted:#405060;
  --green:#00E8A2; --cyan:#00C4FF; --red:#FF4466; --gold:#F0C040; --violet:#B070FF;
  --font:'Outfit',sans-serif; --mono:'DM Mono',monospace;
}
:root[data-theme="dark"], :root:not([data-theme="light"]){ color-scheme:dark; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}
#c{position:fixed;inset:0;display:block}
.hud{position:fixed;inset:0;pointer-events:none}
.hud > *{pointer-events:auto}

#top{position:fixed;left:20px;right:20px;top:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:10px}
.logo-dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 14px rgba(0,232,162,.4);animation:pulse 2s ease infinite}
.logo-text{font-size:18px;font-weight:800;color:var(--white);letter-spacing:-.5px}
.logo-sub{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:2px;margin-left:4px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
#clock{text-align:right}
#clock b{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--white);display:block;line-height:1.1}
#clock span{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}

.tag{position:fixed;left:0;top:0;transform:translate(-50%,-100%);background:linear-gradient(160deg,rgba(10,16,24,.92),rgba(14,22,32,.82));border:1px solid var(--bd);border-radius:10px;padding:8px 11px;line-height:1.35;white-space:nowrap;will-change:transform;transition:opacity .2s,border-color .3s}
.tag b{font-size:13px;font-weight:700;color:var(--white);display:block;letter-spacing:-.2px}
.tag .st{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.tag .pnl{font-family:var(--mono);font-size:11px;color:var(--text);display:block;margin-top:3px}
.tag .pnl i{font-style:normal;color:var(--muted)}
.tag.demo b::after{content:"under construction";font-family:var(--mono);font-size:9px;font-weight:400;color:var(--violet);letter-spacing:1.5px;margin-left:8px;text-transform:uppercase}
.tag.armed{border-color:rgba(0,196,255,.45)} .tag.armed .st{color:var(--cyan)}
.tag.in_trade{border-color:rgba(0,232,162,.6)} .tag.in_trade .st{color:var(--green)}
.tag.locked{border-color:rgba(240,192,64,.5)} .tag.locked .st{color:var(--gold)}
.tag.lockout{border-color:rgba(255,68,102,.5)} .tag.lockout .st{color:var(--red)}
.tag.hidden{opacity:0}

#vaultTag{position:fixed;transform:translate(-50%,-100%);text-align:center;cursor:pointer;background:linear-gradient(160deg,rgba(10,16,24,.92),rgba(14,22,32,.82));border:1px solid rgba(240,192,64,.4);padding:10px 18px;border-radius:12px;will-change:transform;transition:border-color .3s}
#vaultTag:hover,#vaultTag:focus-visible{border-color:var(--gold);outline:none}
#vaultTag b{display:block;font-size:26px;font-weight:700;color:var(--white);letter-spacing:-1px;line-height:1.05}
#vaultTag b.up{color:var(--green)} #vaultTag b.dn{color:var(--red)}
#vaultTag span{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}

#bottom{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:8px;padding:0 20px 14px;background:linear-gradient(180deg,rgba(4,8,13,0),rgba(4,8,13,.92) 40%)}
#days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
#days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;font-family:var(--mono);font-size:10px;padding:5px 8px;border-radius:8px;background:var(--sf);border:1px solid var(--bd);color:var(--muted);cursor:pointer;letter-spacing:.5px}
.day em{font-style:normal;display:block;color:var(--green);font-weight:500}
.day.neg em{color:var(--red)}
.day.cur{border-color:var(--green)}
.day.future{opacity:.35}
#ticker{height:20px;overflow:hidden;white-space:nowrap;font-family:var(--mono);font-size:11px;color:var(--muted)}
#ticker span{margin-right:28px}
#ticker b{color:var(--white);font-weight:500}
#ticker .up{color:var(--green)} #ticker .dn{color:var(--red)} #ticker .lock{color:var(--gold)} #ticker .arm{color:var(--cyan)}
#controls{display:flex;align-items:center;gap:8px}
#scrub{flex:1;appearance:none;height:2px;background:var(--bd);border-radius:2px;outline:none}
#scrub::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(0,232,162,.5)}
#scrub:focus-visible::-webkit-slider-thumb{outline:2px solid var(--white)}
.btn{background:var(--sf);border:1px solid var(--bd);color:var(--text);font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:6px 10px;border-radius:8px;cursor:pointer;transition:border-color .2s}
.btn:hover{border-color:var(--green);color:var(--white)} .btn.on{border-color:var(--green);color:var(--green)}
.btn:focus-visible{outline:2px solid var(--green);outline-offset:1px}

#legend{position:fixed;left:20px;bottom:118px;display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
#legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}

#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,8,13,.7);backdrop-filter:blur(10px)}
#modal.open{display:flex}
#modal .card{width:min(580px,92vw);background:linear-gradient(160deg,var(--sf),rgba(14,22,32,.9));border:1px solid var(--bd);border-radius:18px;padding:30px 32px;text-align:center}
#modal .lbl{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
#modal h2{font-size:48px;font-weight:800;color:var(--green);letter-spacing:-2px;line-height:1;margin:8px 0 6px}
#modal p{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:18px}
#bars{width:100%;height:150px;display:block}
#modal .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px;text-align:left}
#modal .row div{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
#modal .row span{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:4px}
#modal .row b{font-size:16px;font-weight:700;color:var(--white)}
#modal .row b.up{color:var(--green)} #modal .row b.dn{color:var(--red)}
#modal .btn{margin-top:20px}

#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:linear-gradient(180deg,rgba(10,16,24,.96),rgba(14,22,32,.94));border-left:1px solid var(--bd);backdrop-filter:blur(12px);transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column;z-index:5}
#drawer.open{transform:none}
#drawer .hd{padding:22px 24px 14px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#drawer .hd h3{font-size:22px;font-weight:800;color:var(--white);letter-spacing:-.5px;line-height:1}
#drawer .hd .sub{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:6px}
#drawer .hd .sub.demo{color:var(--violet)}
#drawer .x{background:none;border:1px solid var(--bd);color:var(--text);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;line-height:1}
#drawer .x:hover{border-color:var(--green);color:var(--white)}
#drawer .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 24px}
#drawer .stats div{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:9px 10px}
#drawer .stats span{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:3px}
#drawer .stats b{font-size:15px;font-weight:700;color:var(--white)}
#drawer .stats b.up{color:var(--green)} #drawer .stats b.dn{color:var(--red)}
#dBars{display:block;width:calc(100% - 48px);height:70px;margin:0 24px 6px}
#drawer .lbl{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;padding:8px 24px 6px}
#drawer .list{flex:1;overflow-y:auto;padding:0 24px 24px}
.trade{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--bd);font-family:var(--mono);font-size:11px;color:var(--text)}
.trade .l{color:var(--white)} .trade .r{text-align:right;font-weight:500}
.trade .m{color:var(--muted);font-size:10px}
.trade .up{color:var(--green)} .trade .dn{color:var(--red)} .trade .open{color:var(--cyan)}
.trade .day{grid-column:1/-1;color:var(--muted);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding-top:6px}
.tag{cursor:pointer} .tag:hover{border-color:var(--white)}
#who{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);text-align:right;padding-top:6px}
#who b{color:var(--white);font-weight:500;display:block}
#controls select.btn{appearance:none;-webkit-appearance:none;padding-right:22px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 12px) 50%,calc(100% - 8px) 50%;background-size:4px 4px;background-repeat:no-repeat;max-width:200px;text-overflow:ellipsis}
#who a{color:var(--green);text-decoration:none}
#liveBtn.on{border-color:var(--red);color:var(--red)}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,8,13,.75);backdrop-filter:blur(10px);z-index:6}
#login .card{width:min(380px,92vw);background:linear-gradient(160deg,var(--sf),rgba(14,22,32,.95));border:1px solid var(--bd);border-radius:18px;padding:26px 28px;display:flex;flex-direction:column;gap:10px}
#login .lbl{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
#login input{background:var(--bg);border:1px solid var(--bd);color:var(--white);font:inherit;font-size:14px;padding:10px 12px;border-radius:10px}
#login input:focus{outline:none;border-color:var(--green)}
#login .row2{display:flex;gap:8px;flex-wrap:wrap}
#lErr{font-family:var(--mono);font-size:11px;color:var(--red);min-height:14px}
body.public .tag{opacity:.6}
html.embed #top .logo{visibility:hidden}
html.embed #backBtn{display:none}
#backBtn{border-color:rgba(0,232,162,.45);color:var(--white)}
html.embed #whoOut{display:none}
/* equity sparkline in bank tag */
#eqPanel{position:fixed;right:20px;bottom:118px;width:260px;background:linear-gradient(160deg,rgba(10,16,24,.9),rgba(14,22,32,.8));border:1px solid var(--bd);border-radius:12px;padding:10px 12px 8px}
#eqPanel .k{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
#eqPanel .k span{color:var(--green)} #eqPanel .k span.dn{color:var(--red)}
#vaultSpark{display:block;width:100%;height:55px}
/* day boundary overlay */
#dayOv{position:fixed;left:50%;bottom:150px;transform:translate(-50%,8px);pointer-events:none;opacity:0;transition:opacity .25s,transform .25s}
#dayOv.on{opacity:1;transform:translate(-50%,0)}
#dayOv .in{display:flex;align-items:center;gap:14px;background:linear-gradient(160deg,rgba(10,16,24,.92),rgba(14,22,32,.85));border:1px solid var(--bd);border-radius:10px;padding:8px 16px;white-space:nowrap}
#dayOv .k{font-family:var(--mono);font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold)}
#dayOv .d{font-size:15px;font-weight:700;color:var(--white);letter-spacing:-.2px}
#dayOv .p{font-family:var(--mono);font-size:12px;color:var(--muted)}
#dayOv .p.up{color:var(--green)} #dayOv .p.dn{color:var(--red)}
/* cinematic / record mode */
body.cine #legend,body.cine #ticker,body.cine .tags-wrap,body.cine #controls,body.cine .logo-sub{display:none}
body.cine #bottom{background:none;padding-bottom:18px}
body.cine #eqPanel{bottom:70px}
body.cine #dayOv{bottom:70px}
body.cine #exitCine{display:inline-flex}
#exitCine{display:none;position:fixed;top:16px;left:50%;transform:translateX(-50%);align-items:center;gap:8px}
#tags{position:fixed;inset:0;pointer-events:none} #tags .tag{pointer-events:auto}
/* mobile / touch */
@media (max-width:640px){
  .logo-sub{display:none} #legend{display:none}
  #clock b{font-size:16px} #modal h2{font-size:36px}
  .tag{padding:5px 8px;border-radius:8px} .tag b{font-size:11px} .tag .pnl{font-size:10px;margin-top:1px}
  .tag:not(.expanded) .st,.tag:not(.expanded) .pnl i{display:none}
  .tag.demo b::after{font-size:8px;margin-left:5px}
  #vaultTag{padding:7px 12px} #vaultTag b{font-size:20px}
  #eqPanel{right:12px;bottom:168px;width:150px;padding:7px 9px} #vaultSpark{height:36px}
  #dayOv{bottom:172px;left:12px;transform:none;max-width:calc(100vw - 180px)} #dayOv.on{transform:none} #dayOv .in{flex-wrap:wrap;gap:4px 10px;padding:6px 10px} #dayOv .d{font-size:12px}
  #controls{flex-wrap:wrap} #scrub{flex-basis:100%;order:-1}
  .btn{padding:6px 8px;font-size:9px}
  #drawer{width:100vw} #drawer .stats{grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 16px} #drawer .hd,#drawer .list{padding-left:16px;padding-right:16px}
}
/* ── phone layout: chips instead of floating tags, equity in the bottom stack ── */
#chips{display:none}
@media (max-width:640px){
  #top{top:10px;left:12px;right:12px;align-items:center}
  html.embed #top .logo{display:none}
  html.embed #top > div:first-child{display:none}
  #top > div:last-child{width:100%;justify-content:space-between;align-items:center}
  #who{text-align:left;padding-top:0;font-size:9px} #who b{font-size:11px}
  #clock b{font-size:14px} #clock span{font-size:8px}
  #tags{display:none}
  #vaultTag{padding:5px 10px;border-radius:8px;transform:translate(-50%,-100%)}
  #vaultTag b{font-size:13px;letter-spacing:-.3px} #vaultTag span{font-size:7px;letter-spacing:1px}
  #vaultTag{padding:4px 9px}
  #eqPanel{display:none}
  #dayOv{bottom:auto;top:52px;left:12px;right:12px;transform:none;max-width:none} #dayOv.on{transform:none}
  #dayOv .in{justify-content:center;padding:5px 10px} #dayOv .d{font-size:11px} #dayOv .k,#dayOv .p{font-size:9px}
  #chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:5px 8px;font-size:11px;color:var(--white);font-weight:600;white-space:nowrap}
  .chip i{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:0 0 auto}
  .chip.demo{border-style:dashed;color:var(--text)}
  .chip.armed i{background:var(--cyan)} .chip.in_trade i{background:var(--green);box-shadow:0 0 8px var(--green)} .chip.locked i{background:var(--gold)} .chip.lockout i{background:var(--red)}
  .chip span{font-family:var(--mono);font-weight:500;font-size:10px}
  .chip span.up{color:var(--green)} .chip span.dn{color:var(--red)}
  #bottom{gap:6px;padding:0 12px 10px}
  #days{padding:0} .day{font-size:9px;padding:4px 6px}
  #ticker{font-size:10px;height:18px}
  #controls{gap:5px} .btn{padding:5px 7px;font-size:9px;letter-spacing:.5px}
  .spd[data-s="60"],.spd[data-s="7200"],#cineBtn{display:none}
  #controls select.btn{flex-basis:100%;max-width:none}
  #backBtn{padding:4px 7px;font-size:9px}
}
@media (prefers-reduced-motion:reduce){ .tag,.btn,#vaultTag{transition:none} .logo-dot{animation:none} }
</style>
</head>
<body>
<canvas id="c" aria-label="3D city of NQ Alpha trading strategies"></canvas>

<div class="hud">
  <div id="top">
    <div style="display:flex;align-items:center;gap:14px"><div class="logo"><span class="logo-dot"></span><span class="logo-text">NQ Alpha</span><span class="logo-sub">CITY</span></div><a class="btn" id="backBtn" href="/" style="text-decoration:none">← Back to site</a></div>
    <div style="display:flex;gap:10px;align-items:flex-start"><div id="who"></div><div id="clock"><b id="clockT">—</b><span id="clockD">—</span></div></div>
  </div>
  <div id="tags" class="tags-wrap"></div>
  <div id="dayOv" aria-live="polite"><div class="in"><div class="k" id="ovK">market close</div><div class="d" id="ovD">—</div><div class="p" id="ovP"></div></div></div>
  <button class="btn" id="exitCine">Exit cinematic · Esc</button>
  <div id="vaultTag" role="button" tabindex="0" title="Open P&L summary"><b id="vaultPnl">+$0</b><span id="vaultSub">0 trading days · tap for P&amp;L</span></div>
  <div id="eqPanel"><div class="k">Live equity · <span id="eqVal">+$0</span></div><canvas id="vaultSpark" width="520" height="110"></canvas></div>
  <div id="legend">
    <span><i style="background:var(--muted)"></i>watching</span>
    <span><i style="background:var(--cyan)"></i>armed</span>
    <span><i style="background:var(--green)"></i>in trade</span>
    <span><i style="background:var(--gold)"></i>profit locked</span>
    <span><i style="background:var(--red)"></i>filter b lockout</span>
    <span><i style="background:var(--violet)"></i>in testing · under construction</span>
  </div>
  <div id="bottom">
    <div id="chips"></div>
    <div id="days"></div>
    <div id="ticker"></div>
    <div id="controls">
      <button class="btn" id="play" aria-label="Play or pause">Pause</button>
      <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Replay position">
      <button class="btn spd" data-s="60">1m/s</button>
      <button class="btn spd on" data-s="900">15m/s</button>
      <button class="btn spd" data-s="7200">2h/s</button>
      <button class="btn spd" id="spdDemo" data-s="7200" title="Play the whole period in about two minutes">2-min run</button>
      <button class="btn" id="demoToggle">Hide demo</button>
      <button class="btn" id="cineBtn" title="Hide the HUD and orbit slowly for recording">Cinematic</button>
      <button class="btn" id="liveBtn" title="Pin the clock to now and stream new trades">Live</button>
    </div>
  </div>
  <aside id="drawer" aria-label="Strategy detail">
    <div class="hd"><div><h3 id="dName">—</h3><div class="sub" id="dSub"></div></div><button class="x" id="dClose" aria-label="Close">×</button></div>
    <div class="stats" id="dStats"></div>
    <canvas id="dBars" width="392" height="70"></canvas>
    <div class="lbl">Trades · newest first</div>
    <div class="list" id="dList"></div>
  </aside>
  <div id="login" role="dialog" aria-modal="true" style="display:none">
    <form class="card" id="loginForm">
      <div class="lbl">Sign in to see your city</div>
      <input id="lEmail" type="email" placeholder="Email" autocomplete="username">
      <input id="lPass" type="password" placeholder="Password" autocomplete="current-password">
      <div class="row2"><button class="btn" type="submit">Log in</button><button class="btn" type="button" id="lSkip">Watch demo</button></div>
      <div id="lErr"></div>
    </form>
  </div>
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="mTotal">
    <div class="card">
      <div class="lbl">The bank · live strategies</div>
      <h2 id="mTotal">+$0</h2>
      <p id="mSub"></p>
      <canvas id="bars" width="520" height="150"></canvas>
      <div class="row" id="mRow"></div>
      <button class="btn" id="mClose">Close</button>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Central-time trading day: 5:00 PM CT (prev day) → 4:00 PM CT, labeled by the close date ──
const SESSION_S=23*3600;
function ctOffsetMin(ms){try{const v=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',timeZoneName:'shortOffset'}).formatToParts(new Date(ms)).find(p=>p.type==='timeZoneName').value;const m=/GMT([+-]\d+)/.exec(v);return m?parseInt(m[1])*60:-300;}catch(e){return -300;}}
function ctToMs(y,mo,d,h,mi=0){let ms=Date.UTC(y,mo,d,h,mi);ms-=ctOffsetMin(ms)*60000;return ms;}
function ctParts(ms){const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',hour12:false}).formatToParts(new Date(ms));const g=t=>+p.find(x=>x.type===t).value;return {y:g('year'),m:g('month')-1,d:g('day'),h:g('hour')%24};}
function dayOpen(day){const p=ctParts(day.getTime());return ctToMs(p.y,p.m,p.d-1,17);}
function buildDays(fromMs,toMs){const out=[];const a=ctParts(fromMs),b=ctParts(toMs);let cur=new Date(Date.UTC(a.y,a.m,a.d,12));const end=new Date(Date.UTC(b.y,b.m,b.d,12));
  // if the first event is after 5 PM CT it belongs to the next trading day
  if(a.h>=17) cur.setUTCDate(cur.getUTCDate()+1);
  if(b.h>=17) end.setUTCDate(end.getUTCDate()+1);
  while(cur<=end){const w=cur.getUTCDay();if(w>0&&w<6) out.push(new Date(cur));cur.setUTCDate(cur.getUTCDate()+1);} return out.length?out:[new Date(Date.UTC(b.y,b.m,b.d,12))];}

let days=[], events=[], BOTS=[];
const dayIdx=t=>{for(let i=days.length-1;i>=0;i--) if(t>=dayOpen(days[i])) return i; return 0;};
let T_TOTAL=0;
const simToMs=s=>{const d=Math.min(days.length-1,Math.floor(s/SESSION_S));return dayOpen(days[d])+(s-d*SESSION_S)*1e3;};
const msToSim=ms=>{const d=dayIdx(ms);return d*SESSION_S+Math.max(0,Math.min(SESSION_S,(ms-dayOpen(days[d]))/1e3));};

// ── mock feed (kept for demos: ?mock=1) ──
function mockFeed(){
  const bots=Object.values(ALL_BOTS); const ev=[]; let px=24400;
  const ds=buildDays(Date.UTC(2026,8,8), Date.UTC(2026,9,8));
  ds.forEach(day=>{const base=dayOpen(day)+15.5*3600e3; // start at 8:30 AM CT
    bots.forEach(b=>{const tpd=b.live?[2,5]:[0,3],wr=b.live?.7:.62;const n=Math.round(tpd[0]+rnd()*(tpd[1]-tpd[0]));
      const slots=[];for(let i=0;i<n;i++)slots.push(base+300e3+rnd()*(6*3600e3));slots.sort((a,b)=>a-b);let lastExit=0,stops=0;
      for(let i=0;i<n;i++){let t=Math.max(slots[i],lastExit+240e3);const qty=b.live?1+Math.floor(rnd()*3):1;px+=(rnd()-.5)*60;
        ev.push({t,bot:b.id,type:'fill',qty,px:+px.toFixed(2)});const win=rnd()<wr;const pts=win?(b.live?40+rnd()*35:40):-(b.live?65:40);
        t+=180e3+rnd()*1500e3;ev.push({t,bot:b.id,type:'exit',pnl:Math.round(pts*PT*qty),pts:Math.round(pts),px:+(px+pts).toFixed(2),reason:win?'target':'stop'});lastExit=t;
        if(!win&&++stops>=2){ev.push({t:t+1,bot:b.id,type:'lockout'});lastExit=t+1800e3;stops=0;}}});});
  return ev.sort((a,b)=>a.t-b.t);
}

}

  const hl=new THREE.Mesh(new THREE.BoxGeometry(.7,.08,.04),new THREE.MeshBasicMaterial({color:0xFFF3D6}));hl.position.set(0,.4,1.23);g.add(hl);
  const tl=new THREE.Mesh(new THREE.BoxGeometry(.7,.08,.04),new THREE.MeshBasicMaterial({color:0xFF4466}));tl.position.set(0,.45,-.96);g.add(tl);
  const lamp=new THREE.PointLight(0xFFF3D6,6,10,2);lamp.position.set(0,.6,1.6);g.add(lamp);
  const wg=new THREE.CylinderGeometry(.18,.18,.16,12),wm=std({color:0x080a0e,roughness:.9}),rg=new THREE.CylinderGeometry(.1,.1,.17,10);
  [[-.47,.6],[.47,.6],[-.47,-.55],[.47,-.55]].forEach(([x,z])=>{const w=new THREE.Mesh(wg,wm);w.rotation.z=Math.PI/2;w.position.set(x,.18,z);g.add(w);const r=new THREE.Mesh(rg,new THREE.MeshBasicMaterial({color:0xF0C040}));r.rotation.z=Math.PI/2;r.position.set(x,.18,z);g.add(r);g.userData.rims=(g.userData.rims||[]).concat(r);});

function tintTruck(g,hex){ g.userData.stripe.material.color.set(hex); g.userData.rims.forEach(r=>r.material.color.set(hex)); g.userData.vd.material.color.set(hex); g.userData.vd.material.emissive.set(hex); }
function dispatchTruck(tw,amount,now,loss=false){
  const g=truckPool.pop()||makeTruck(); tintTruck(g,loss?0xFF4466:0xF0C040); scene.add(g);
  trucks.push({g,tw,t0:now,amount,loss,phase:'out'});
}
const DUR_OUT=2.6, DUR_WAIT=.7;
const easeIO=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
function updateTrucks(now){
  for(let i=trucks.length-1;i>=0;i--){const tr=trucks[i],e=now-tr.t0;const d=tr.tw.dir;
    const rOut=R-5.2, rIn=R_BANK+1.6; let r,dirSign;
    if(tr.loss){ // bank → tower, facing outward
      dirSign=1;
      if(e<DUR_OUT){r=rIn+(rOut-rIn)*easeIO(e/DUR_OUT);}
      else if(e<DUR_OUT+DUR_WAIT){r=rOut;if(tr.phase==='out'){tr.phase='arrive';tr.tw.burstT=now;tr.tw.burstCol=C.red;}}
      else{scene.remove(tr.g);truckPool.push(tr.g);trucks.splice(i,1);continue;}
    } else {   // tower → bank, deposit, vanish
      dirSign=-1;
      if(e<DUR_OUT){r=rOut+(rIn-rOut)*easeIO(e/DUR_OUT);}
      else if(e<DUR_OUT+DUR_WAIT){r=rIn;if(tr.phase==='out'){tr.phase='deposit';bank.userData.flashT=now;}}
      else{scene.remove(tr.g);truckPool.push(tr.g);trucks.splice(i,1);continue;}
    }
    const off=1.1;
    tr.g.position.set(d.x*r - d.z*off*dirSign, 1.45, d.z*r + d.x*off*dirSign);
    tr.g.rotation.y=Math.atan2(d.x*dirSign, d.z*dirSign);
  }
}

  sparkG.strokeStyle='#162030';sparkG.lineWidth=1;sparkG.beginPath();sparkG.moveTo(6,Y(0));sparkG.lineTo(W-6,Y(0));sparkG.stroke();
  if(pts.length<1) return;
  sparkG.beginPath();sparkG.moveTo(X(0),Y(0));pts.forEach((v,i)=>sparkG.lineTo(X(i),Y(v)));sparkG.lineTo(X(pts.length-1),Y(0));sparkG.closePath();
  sparkG.fillStyle=total>=0?'rgba(0,232,162,.14)':'rgba(255,68,102,.14)';sparkG.fill();
  sparkG.beginPath();sparkG.moveTo(X(0),Y(0));pts.forEach((v,i)=>sparkG.lineTo(X(i),Y(v)));
  sparkG.strokeStyle=total>=0?'#00E8A2':'#FF4466';sparkG.lineWidth=2.5;sparkG.lineJoin='round';sparkG.stroke();
  const ev=document.getElementById('eqVal'); ev.textContent=fmt$(total); ev.className=total<0?'dn':'';
  const lx=X(pts.length-1),ly=Y(pts[pts.length-1]);sparkG.fillStyle='#F0F4F8';sparkG.beginPath();sparkG.arc(lx,ly,3.2,0,Math.PI*2);sparkG.fill();
}

/* ─── day boundary beat ─── */
ov=document.getElementById('dayOv');
const BEAT=2.2;
function startDayBeat(prevDi,nextDi,now){ dayBeat={t0:now,prevDi,nextDi}; ov.classList.add('on');
  document.getElementById('ovK').textContent='market close';
  document.getElementById('ovD').textContent=days[prevDi].toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric',timeZone:'UTC'});
  const p=document.getElementById('ovP'); p.textContent=fmt$(perDayPnl[prevDi])+' · day '+(prevDi+1); p.className='p '+(perDayPnl[prevDi]<0?'dn':'up'); }
function updateDayBeat(now){ if(!dayBeat) return 1;
  const e=now-dayBeat.t0;
  if(e>BEAT*.55&&document.getElementById('ovK').textContent==='market close'){document.getElementById('ovK').textContent='market open';document.getElementById('ovD').textContent=days[dayBeat.nextDi].toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric',timeZone:'UTC'});document.getElementById('ovP').textContent='day '+(dayBeat.nextDi+1)+' · 5:00 PM CT open';document.getElementById('ovP').className='p';}
  if(e>=BEAT){dayBeat=null;ov.classList.remove('on');return 1;}
  // dim factor for beams: fade out then in
  return e<BEAT*.5? 1-e/(BEAT*.5) : (e-BEAT*.5)/(BEAT*.5);
}

/* ─── skyline occlusion: blocks between camera and the city go transparent ─── */
const _zero=new THREE.Matrix4().makeScale(0,0,0), _camXZ=new THREE.Vector3(), _dirXZ=new THREE.Vector3(), _tmp=new THREE.Vector3();
function updateOcclusion(){
  _camXZ.set(camera.position.x,0,camera.position.z); _dirXZ.set(controls.target.x,0,controls.target.z).sub(_camXZ); const L=_dirXZ.length(); _dirXZ.divideScalar(L||1);
  const camDist=camera.position.length();
  window.__sky.forEach(rec=>{let changed=false;
    for(let i=0;i<rec.n;i++){ _tmp.copy(rec.pos[i]).sub(_camXZ); const t=_tmp.dot(_dirXZ); let hit=0;
      if(t>-rec.rad[i]&&t<L){ const perp=Math.sqrt(Math.max(0,_tmp.lengthSq()-t*t)); const margin=10+rec.rad[i]+Math.max(0,1-t/L)*14; if(perp<margin) hit=1; }
      if(rec.pos[i].length()<camDist-6) {} else hit=0; // only blocks nearer than the camera's orbit can occlude
      if(hit!==rec.state[i]){ rec.state[i]=hit; if(hit){rec.mesh.setMatrixAt(i,_zero);rec.ghost.setMatrixAt(i,rec.mats[i]);} else {rec.mesh.setMatrixAt(i,rec.mats[i]);rec.ghost.setMatrixAt(i,_zero);} changed=true; } }
    if(changed){rec.mesh.instanceMatrix.needsUpdate=true;rec.ghost.instanceMatrix.needsUpdate=true;} });
}

/* ─── live mode: clock pinned to now, SSE stream ─── */
let live=false, es=null;
function setLive(on){ live=on; document.getElementById('liveBtn').classList.toggle('on',on); scrub.disabled=on; document.querySelectorAll('.spd').forEach(b=>b.disabled=on);
  if(on){ if(!playing) togglePlay(); seek(msToSim(Date.now())); if(!MOCK&&!PUBLIC&&!es){ const q=new URLSearchParams(); if(ADMIN)q.set('admin',ADMIN);else q.set('token',TOKEN); if(ME.is_admin&&ACCT)q.set('account',ACCT); if(ME.is_admin&&WANT_DEMO)q.set('demo','1');
      es=new EventSource(`${API}/city/stream?${q}`); es.onmessage=m=>{try{const e=JSON.parse(m.data); if(!e.t) return; const seen=events.some(x=>x.trade_id===e.trade_id&&x.type===e.type&&x.bot===e.bot); if(seen) return; normalize([e]).forEach(n=>events.push(n)); }catch(x){}}; } }
  else if(es){es.close();es=null;}
}
document.getElementById('liveBtn').onclick=()=>setLive(!live);
if(QS.get('live')==='1'||(!MOCK&&!PUBLIC&&!QS.has('day')&&!window.__closedWindow)) setTimeout(()=>setLive(true),300);

/* ═══════════════ LOOP ═══════════════ */
const v3=new THREE.Vector3(),clock=new THREE.Clock(); let last=0;
const colFor={watching:null,armed:new THREE.Color(C.cyan),in_trade:new THREE.Color(C.green),locked:new THREE.Color(C.gold),lockout:new THREE.Color(C.red)};
const beamFor={watching:0,armed:.16,in_trade:.42,locked:.26,lockout:.22};
function project(obj,el,yOff){v3.set(0,yOff,0);obj.localToWorld(v3);v3.project(camera);el.style.transform=`translate(-50%,-100%) translate(${(v3.x*.5+.5)*innerWidth}px,${(-v3.y*.5+.5)*innerHeight}px)`;el.style.opacity=v3.z<1?'':'0';}
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),.1),now=clock.elapsedTime;
  const beatF=updateDayBeat(now);
  if(live){ const nowMs=Date.now(); if(dayIdx(nowMs)>=days.length-1&&nowMs>dayOpen(days[days.length-1])+SESSION_S*1e3+3600e3){days=buildDays(events.length?events[0].t:nowMs-7*86400e3,nowMs);T_TOTAL=days.length*SESSION_S;} sim=Math.min(T_TOTAL,msToSim(nowMs)); }
  else if(playing&&!dayBeat){sim=Math.min(T_TOTAL,sim+speed*dt);const ms=simToMs(sim);while(ptr<events.length&&events[ptr].t<=ms){applyEvent(events[ptr],now);ptr++;}if(sim>=T_TOTAL&&!live){playing=false;playBtn.textContent='Replay';}}
  const ms=simToMs(sim),di=Math.min(days.length-1,Math.floor(sim/SESSION_S));
  if(di!==lastDi){ if(di===lastDi+1&&playing&&!reduced&&speed<=7200) startDayBeat(lastDi,di,now); lastDi=di; }
  if(now-last>.15){last=now;
    document.getElementById('clockT').textContent=fmtT(ms); document.getElementById('clockD').textContent=new Date(ms).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric',year:'numeric',timeZone:'America/Chicago'});
    scrub.value=Math.round(sim/T_TOTAL*1000);
    const vp=document.getElementById('vaultPnl'); vp.textContent=fmt$(total); vp.className=total<0?'dn':'up';
    document.getElementById('vaultSub').textContent=innerWidth<=640?'tap for P&L':`${di+1} trading days · tap for P&L`;
    dayEls.forEach((el,i)=>{el.classList.toggle('future',i>di);el.classList.toggle('cur',i===di);el.classList.toggle('neg',perDayPnl[i]<0);el.querySelector('em').textContent=i<=di?fmt$(perDayPnl[i]):'—';});
    dayEls[di]?.scrollIntoView({inline:'center',block:'nearest',behavior:reduced?'auto':'smooth'});
    drawSpark(di);
    if(drawerBot&&playing) renderDrawer();
  }
  const k=reduced?1:1-Math.pow(.001,dt);
  towers.forEach(tw=>{
    if(tw.state==='lockout'&&tw.lockT&&ms-tw.lockT>30*60e3){tw.state='watching';updateTag(tw);}
    if(tw.state==='armed'&&tw.armT&&ms-tw.armT>20*60e3){tw.state='watching';updateTag(tw);}
    const s=tw.state, target=colFor[s]||tw.accent;
    tw.beam.material.color.lerp(target,k); tw.halo.material.color.copy(tw.beam.material.color);
    const pulse=s==='armed'?.55+.45*Math.sin(now*5):1;
    tw.beam.material.opacity+=(beamFor[s]*pulse*beatF-tw.beam.material.opacity)*k;
    const bw=s==='in_trade'?1.5:1; tw.beam.scale.set(bw,1,bw);
    const bt=now-tw.burstT; if(bt<1.4){const u=bt/1.4;tw.burst.material.color.set(tw.burstCol);tw.burst.material.opacity=.75*(1-u)*(1-u);const w=1+u*1.6;tw.burst.scale.set(w,1,w);}else tw.burst.material.opacity=0;
    if(tw.g.userData.crane){const cr=tw.g.userData.crane;cr.rotation.y=Math.sin(now*.45+tw.b.h)*.7;const bl=.4+.6*(Math.sin(now*4+tw.b.h)>0?1:0);tw.g.userData.lamp.material.color.setRGB(.94*bl,.63*bl,.31*bl);tw.g.userData.warn.forEach((w,k)=>w.material.color.setRGB(.94,.63,.31).multiplyScalar(Math.sin(now*3+k*1.6)>0?1:.25));}
    if(tw.g.visible) project(tw.g,tw.tag,tw.top+(tw.b.live?1.2:8.5));
  });
  updateTrucks(now);
  const bf=now-bank.userData.flashT; bank.userData.light.intensity=24+4*Math.sin(now*2)+(bf<.8?40*(1-bf/.8):0);
  project(bank,vt,innerWidth<=640?13.5:16.5);
  for(let i=0;i<40;i++){const a=now*.11+i*(Math.PI*2/40)*(i%2?1:-1);m.compose(v1.set(Math.cos(a)*35.6,1.6,Math.sin(a)*35.6),q,new THREE.Vector3(1,1,1));cars.setMatrixAt(i,m);} cars.instanceMatrix.needsUpdate=true;
  stars.material.uniforms.uT.value=now;
  controls.autoRotate=playing&&!reduced; controls.autoRotateSpeed=cine?.55:.3; controls.update();
  updateOcclusion();
  composer.render();
}
function fitCamera(){const a=innerWidth/innerHeight;camera.aspect=a;camera.updateProjectionMatrix();controls.maxDistance=a<1?210:96;if(a<1){const d=camera.position.length();if(d<160){camera.position.multiplyScalar(175/d);}}}
addEventListener('resize',()=>{fitCamera();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
fitCamera();
{ const chips=document.getElementById('chips');
  towers.forEach((tw,id)=>{ const c=document.createElement('button'); c.type='button'; c.className='chip'; c.innerHTML=`<i></i>${tw.b.name}<span>+$0</span>`; c.onclick=()=>openDrawer(id); chips.appendChild(c); tw.chip=c; });
  const narrow=matchMedia('(max-width:640px)').matches; if(narrow){ const eq=document.getElementById('eqPanel'); const bottom=document.getElementById('bottom'); bottom.insertBefore(eq,chips); } }
towers.forEach(tw=>updateTag(tw)); seek(0); applyUrlParams(); frame();
</script>
